<script>
(function(){
  var urls = ["https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js", "https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"];
  window.VC_SDK = { intentos: [] };
  function cargar(i){
    if (i >= urls.length) return;
    var s = document.createElement('script');
    s.src = urls[i];
    s.onload = function(){ VC_SDK.intentos.push(urls[i] + ' -> cargó'); };
    s.onerror = function(){ VC_SDK.intentos.push(urls[i] + ' -> no cargó'); cargar(i + 1); };
    document.head.appendChild(s);
  }
  cargar(0);
})();
</script>
<script>
/* =====================================================================
 * PUENTE  Zoho Creator  <->  Visor de Campo
 * ---------------------------------------------------------------------
 * Hace que el Index.html y el Código.gs originales funcionen dentro de un
 * widget de Creator sin reescribirlos:
 *   - Emula google.script.run (mismos nombres de función del servidor).
 *   - Emula SpreadsheetApp / CacheService / Session / Utilities / Logger.
 *   - La "hoja" vive en memoria y se llena desde los formularios VC_ de Creator.
 *   - Las escrituras (roles y gestor de campos) se guardan de vuelta en Creator.
 * ===================================================================== */

/*CORE-START*/
var VC_CORE = (function(){
  'use strict';
  var TZ = 'America/Lima';

  /* ---------- tipado: Creator guarda todo como texto; la hoja tenía tipos ---------- */
  function tipar(v){
    if (v === null || v === undefined) return '';
    if (typeof v !== 'string'){
      if (typeof v === 'object') return (v.display_value != null) ? String(v.display_value) : JSON.stringify(v);
      return v;
    }
    var t = v.trim();
    if (t === '') return '';
    var u = t.toUpperCase();
    if (u === 'TRUE') return true;
    if (u === 'FALSE') return false;
    if (/^-?(0|[1-9]\d*)(\.\d+)?([eE][-+]?\d+)?$/.test(t)){
      var dig = t.replace(/^-/, '').replace(/[eE].*$/, '').replace('.', '').replace(/^0+(?=\d)/, '');
      if (dig.length <= 15) return Number(t);       // IDs largos (CRM) se quedan como texto
    }
    return v;
  }

  /* ---------- Utilities.formatDate ---------- */
  function fmtFecha(date, tz, patron){
    var d = (date instanceof Date) ? date : new Date(date);
    if (isNaN(d.getTime())) return '';
    var f = new Intl.DateTimeFormat('en-US', { timeZone: tz || TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', weekday: 'short' });
    var p = {};
    f.formatToParts(d).forEach(function(x){ p[x.type] = x.value; });
    var dow = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[p.weekday];
    var m = { yyyy: p.year, MM: p.month, dd: p.day, HH: (p.hour === '24' ? '00' : p.hour), mm: p.minute, ss: p.second,
              M: String(Number(p.month)), d: String(Number(p.day)), u: String(dow) };
    return String(patron).replace(/yyyy|MM|dd|HH|mm|ss|M|d|u/g, function(t){ return m[t]; });
  }

  /* ---------- valor de hoja -> texto para Creator ---------- */
  function aTexto(v){
    if (v === null || v === undefined) return '';
    if (v instanceof Date) return fmtFecha(v, TZ, 'yyyy-MM-dd HH:mm:ss');
    if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
    return String(v);
  }

  function filaVacia(f){
    if (!f) return true;
    for (var i = 0; i < f.length; i++){ if (f[i] !== '' && f[i] !== null && f[i] !== undefined) return false; }
    return true;
  }

  /* ---------- Hoja y Rango en memoria (subconjunto de SpreadsheetApp que usa Código.gs) ---------- */
  function Hoja(nombre, filas){ this.nombre = nombre; this.filas = filas || []; this.sucia = false; }
  Hoja.prototype.getName = function(){ return this.nombre; };
  Hoja.prototype.getLastRow = function(){
    var n = this.filas.length;
    while (n > 0 && filaVacia(this.filas[n - 1])) n--;
    return n;
  };
  Hoja.prototype.getLastColumn = function(){
    var m = 0;
    for (var r = 0; r < this.filas.length; r++){
      var f = this.filas[r] || [];
      for (var i = f.length; i > m; i--){ if (f[i - 1] !== '' && f[i - 1] !== null && f[i - 1] !== undefined){ m = i; break; } }
    }
    return m;
  };
  Hoja.prototype.getRange = function(r, c, nr, nc){ return new Rango(this, r, c, nr == null ? 1 : nr, nc == null ? 1 : nc); };
  Hoja.prototype.getDataRange = function(){ return new Rango(this, 1, 1, Math.max(this.getLastRow(), 1), Math.max(this.getLastColumn(), 1)); };
  Hoja.prototype.appendRow = function(arr){
    this.filas.length = this.getLastRow();
    this.filas.push((arr || []).slice());
    this.sucia = true;
    return this;
  };
  Hoja.prototype.deleteRow = function(r){ this.filas.splice(r - 1, 1); this.sucia = true; return this; };
  Hoja.prototype.clearContents = function(){ this.filas = []; this.sucia = true; return this; };
  Hoja.prototype.clear = Hoja.prototype.clearContents;

  function Rango(h, r, c, nr, nc){ this.h = h; this.r = r; this.c = c; this.nr = nr; this.nc = nc; }
  Rango.prototype.getValues = function(){
    var out = [];
    for (var i = 0; i < this.nr; i++){
      var f = this.h.filas[this.r - 1 + i] || [], fila = [];
      for (var j = 0; j < this.nc; j++){ var v = f[this.c - 1 + j]; fila.push(v === undefined || v === null ? '' : v); }
      out.push(fila);
    }
    return out;
  };
  Rango.prototype.getDisplayValues = function(){ return this.getValues().map(function(f){ return f.map(function(v){ return aTexto(v); }); }); };
  Rango.prototype.getValue = function(){ return this.getValues()[0][0]; };
  Rango.prototype.setValues = function(m){
    for (var i = 0; i < m.length; i++){
      var idx = this.r - 1 + i;
      while (this.h.filas.length <= idx) this.h.filas.push([]);
      var f = this.h.filas[idx];
      for (var j = 0; j < m[i].length; j++){
        while (f.length < this.c - 1 + j) f.push('');
        f[this.c - 1 + j] = m[i][j];
      }
    }
    this.h.sucia = true;
    return this;
  };
  Rango.prototype.setValue = function(v){ return this.setValues([[v]]); };
  Rango.prototype.getRow = function(){ return this.r; };
  Rango.prototype.getColumn = function(){ return this.c; };
  Rango.prototype.createTextFinder = function(txt){
    var rg = this, entera = false;
    var tf = {
      matchEntireCell: function(b){ entera = !!b; return tf; },
      matchCase: function(){ return tf; },
      findNext: function(){
        var vals = rg.getValues(), t = String(txt).trim();
        for (var i = 0; i < vals.length; i++){
          for (var j = 0; j < vals[i].length; j++){
            var s = String(vals[i][j]).trim();
            if (entera ? s === t : s.indexOf(t) > -1) return new Rango(rg.h, rg.r + i, rg.c + j, 1, 1);
          }
        }
        return null;
      }
    };
    return tf;
  };

  /* ---------- libro (SpreadsheetApp.openById) ---------- */
  var LIBRO = { hojas: {} };
  var libroApi = {
    getSheetByName: function(n){ return LIBRO.hojas[n] || null; },
    getSheets: function(){ return Object.keys(LIBRO.hojas).map(function(k){ return LIBRO.hojas[k]; }); },
    insertSheet: function(n){ var h = new Hoja(n, []); LIBRO.hojas[n] = h; return h; }
  };
  var SpreadsheetApp = { openById: function(){ return libroApi; }, getActiveSpreadsheet: function(){ return libroApi; } };

  /* ---------- CacheService (memoria de la sesión) ---------- */
  var CACHE = {};
  var cacheApi = {
    get: function(k){ var e = CACHE[k]; if (!e) return null; if (Date.now() > e.exp){ delete CACHE[k]; return null; } return e.v; },
    put: function(k, v, ttl){ CACHE[k] = { v: String(v), exp: Date.now() + (ttl || 600) * 1000 }; },
    remove: function(k){ delete CACHE[k]; }
  };
  var CacheService = { getScriptCache: function(){ return cacheApi; }, getUserCache: function(){ return cacheApi; } };
  function limpiarCache(){ CACHE = {}; }

  /* ---------- Session / Utilities / Logger ---------- */
  var SESION = { email: '' };
  var Session = {
    getActiveUser: function(){ return { getEmail: function(){ return SESION.email; } }; },
    getEffectiveUser: function(){ return { getEmail: function(){ return SESION.email; } }; },
    getScriptTimeZone: function(){ return TZ; }
  };
  var Utilities = { formatDate: fmtFecha };
  var Logger = { log: function(){ try { console.log.apply(console, arguments); } catch(e){} } };
  var HtmlService = {};

  return { tipar: tipar, aTexto: aTexto, fmtFecha: fmtFecha, filaVacia: filaVacia, Hoja: Hoja, LIBRO: LIBRO,
           SESION: SESION, limpiarCache: limpiarCache,
           shims: { SpreadsheetApp: SpreadsheetApp, CacheService: CacheService, Session: Session,
                    Utilities: Utilities, Logger: Logger, HtmlService: HtmlService } };
})();

/* Código.gs original, encapsulado: sus funciones no chocan con las del Index.html. */
var VC_SERVER = (function(SpreadsheetApp, CacheService, Session, Utilities, Logger, HtmlService){
/**
 * Visor de Tiendas — PayJoy (roles + baja lógica + optimizado)
 *
 * SEGURIDAD: la app se implementa "Ejecutar como: yo". Cada función sensible
 * valida en el servidor el rol del usuario autenticado.
 *
 * CARGA UNIFICADA: getBootstrap() lee la pestaña Tiendas UNA sola vez y, sobre
 * ese mismo array, arma tanto las tarjetas (getStores) como el Resumen
 * (getResumen). Devuelve { stores, resumen } y cachea la salida ya procesada
 * por alcance. Visitas se mantiene aparte (getVisitas).
 */

// ============ CONFIGURACIÓN ============
const CONFIG = {
  SHEET_ID:   '1HIu01Iz43z4ZF0x2ISEZj0_05K7UxLfLlUvR02Ql1PM',
  SHEET_NAME: 'Tiendas',
  EMAIL_COL:  'EJECUTIVO',
  TITLE_COL:  'MERCHANT',
  CARD_COLS:  ['ADMIN', 'EJECUTIVO', 'MANAGER', 'HABILITADO', 'PROCEDENCIA'],

  // --- Roles ---
  USERS_SHEET:      'USUARIOS',
  USERS_EMAIL:      'CORREO',
  USERS_ROLE:       'ROL',
  USERS_ESTADO:     'ESTADO',
  MAESTRO_FALLBACK: 'alfredo.cortez@payjoy.com',

  // --- Gestión de campos del detalle ---
  CAMPOS_SHEET:     'CONFIG_CAMPOS',
  CALCULADOS_SHEET: 'CONFIG_CALCULADOS',

  // --- Visitas ---
  VISITAS_SHEET:    'Visitas'
};

const ROLES_VALIDOS = ['usuario', 'admin', 'supervisor', 'maestro'];
const USERS_HEADERS = ['CORREO', 'ROL', 'ESTADO', 'EQUIPO', 'SUPERVISOR', 'FECHA_ALTA', 'FECHA_BAJA', 'NOTAS'];
const CAMPOS_HEADERS = ['COLUMNA', 'ETIQUETA', 'EN_DETALLE', 'ORDEN', 'FORMATO', 'PROTEGIDA'];
const FORMATOS_VALIDOS = ['TEXTO', 'ENTERO', 'DECIMAL', 'PORCENTAJE', 'FECHA'];
const CALCULADOS_HEADERS = ['CLAVE', 'TIPO', 'ORIGEN', 'DEFINICION'];
const TIPOS_CALCULADOS = ['semaforo', 'semaforo_inv', 'concatenado', 'formula'];

// Columnas que la TARJETA necesita de 'Tiendas'. (Referencia. La lectura
// unificada de getBootstrap lee el ancho completo porque el Resumen requiere
// columnas extra —cuotas, activada, con_cupo—; ambas partes trabajan sobre
// el mismo array leído una sola vez.)
const CARD_SOURCE_COLS = [
  'MERCHANTID','MERCHANTNAME','ADMINID','ADMINNAME','PROCEDENCIA','HABILITADO',
  'TIPO_TIENDA','EJECUTIVO','MANAGER','VENTA_TOTAL','VENTA_R_1','DIF_REL',
  'VISITAS','FFPD7_LAST30D','VFPD7_LAST30D','FFPD15_LAST4W','VFPD15_LAST4W'
];

// --- Umbrales de semáforos ---
// FPD7/FPD15/Dif. mensual ya NO viven aquí: salen de recetas de CONFIG_CALCULADOS
// (una sola fuente de verdad para tarjeta y detalle). Aquí queda solo lo que sigue en código.
const SEM = {
  BADGE_VISITAS: true        // pon en false para ocultar el badge "Sin visita"
};

function numOrNull_(x){
  if (x === null || x === undefined) return null;
  var s = String(x).trim().replace('%','').replace(/,/g,'');
  if (s === '') return null;
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}

/* ---------- normalización case-insensitive ----------
 * Todo lookup de columna pasa por aquí: encuentra la data sin importar si el
 * encabezado está en mayúsculas, minúsculas o combinado (ej. "Visitas"). */
function norm_(s){ return String(s == null ? '' : s).trim().toUpperCase(); }

// EJECUTIVO<->PAYJOYOWNER, MANAGER<->SUPERVISOR: cualquier lookup por el nombre viejo o el nuevo funciona.
var COL_ALIASES = { 'PAYJOYOWNER':'EJECUTIVO', 'EJECUTIVO':'PAYJOYOWNER', 'SUPERVISOR':'MANAGER', 'MANAGER':'SUPERVISOR' };
function applyAliases_(m){
  Object.keys(COL_ALIASES).forEach(function(a){ var b = COL_ALIASES[a]; if (m[a] === undefined && m[b] !== undefined) m[a] = m[b]; });
  return m;
}
function headerIndexMap_(headers){
  var m = {};
  headers.forEach(function(h, i){ m[norm_(h)] = i; });
  return applyAliases_(m);
}
function idx_(map, name){ var i = map[norm_(name)]; return (i === undefined) ? -1 : i; }

function toBool_(v){
  if (v === true) return true;
  if (v === false || v === null || v === undefined || v === '') return false;
  var s = String(v).trim().toUpperCase();
  return s === 'TRUE' || s === 'VERDADERO' || s === 'SI' || s === 'SÍ' || s === '1' || s === 'X';
}
// =======================================

function doGet() {
  return HtmlService.createTemplateFromFile('Index')
    .evaluate()
    .setTitle('Visor de Tiendas')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

/* ---------- helpers ---------- */
function ss_() { return SpreadsheetApp.openById(CONFIG.SHEET_ID); }

function activeEmail_() {
  return (Session.getActiveUser().getEmail() || '').trim().toLowerCase();
}

function mainSheet_() {
  const sh = ss_().getSheetByName(CONFIG.SHEET_NAME);
  if (!sh) {
    const disp = ss_().getSheets().map(function (s) { return s.getName(); });
    throw new Error('No se encontró la pestaña "' + CONFIG.SHEET_NAME + '". Disponibles: ' + disp.join(' | '));
  }
  return sh;
}

/* ---------- roles ---------- */
function ensureUsersSheet_() {
  const ss = ss_();
  var sh = ss.getSheetByName(CONFIG.USERS_SHEET);
  if (!sh) {
    sh = ss.insertSheet(CONFIG.USERS_SHEET);
    sh.appendRow(USERS_HEADERS);
  }
  return sh;
}

/** Lee USUARIOS y la cachea 90s. Case-insensitive en los encabezados. */
function readUsers_() {
  var cache = CacheService.getScriptCache();
  var hit = cache.get('USERS_CFG');
  if (hit) return JSON.parse(hit);

  var sh = ensureUsersSheet_();
  var values = sh.getDataRange().getValues();
  var H = headerIndexMap_(values[0]);
  var eIdx = idx_(H, CONFIG.USERS_EMAIL);
  var rIdx = idx_(H, CONFIG.USERS_ROLE);
  var sIdx = idx_(H, CONFIG.USERS_ESTADO);
  var map = {}, list = [];
  for (var i = 1; i < values.length; i++) {
    var e = String(values[i][eIdx]).trim().toLowerCase();
    if (!e) continue;
    var rol = String(values[i][rIdx]).trim().toLowerCase();
    var estado = (sIdx > -1 && String(values[i][sIdx]).trim()) ? String(values[i][sIdx]).trim().toUpperCase() : 'ACTIVO';
    map[e] = { rol: rol, estado: estado };
    list.push({ correo: e, rol: rol, estado: estado });
  }
  var out = { map: map, list: list };
  cache.put('USERS_CFG', JSON.stringify(out), 90); // 90s; se limpia al cambiar/dar de baja
  return out;
}
function clearUsersCache_(){ CacheService.getScriptCache().remove('USERS_CFG'); }

function roleOf_(email){
  if (!email) return 'sin_acceso';
  if (email === CONFIG.MAESTRO_FALLBACK.trim().toLowerCase()) return 'maestro';
  var u = readUsers_().map[email];
  if (u){ if (u.estado === 'BAJA') return 'baja'; return u.rol; }        // en la lista
  if (/@(payjoy\.com|ext\.payjoy\.com)$/.test(email)) return 'solicitar'; // dominio válido, sin alta
  return 'sin_acceso';
}
function hasAccess_(rol){ return ['maestro','admin','supervisor','usuario'].indexOf(String(rol||'').toLowerCase()) > -1; }

function requireMaestro_() {
  const email = activeEmail_();
  if (roleOf_(email) !== 'maestro') throw new Error('Acción no permitida: se requiere rol maestro.');
  return email;
}

/* ---------- CONFIG_CAMPOS (gobierna el detalle) ---------- */

/** Lee CONFIG_CAMPOS y la cachea 60s. Devuelve {map (por clave normalizada), order (claves ordenadas por ORDEN)}. */
function readCampos_(){
  var cache = CacheService.getScriptCache();
  var hit = cache.get('CAMPOS_CFG');
  if (hit) return JSON.parse(hit);

  var sh = ss_().getSheetByName(CONFIG.CAMPOS_SHEET);
  var map = {}, order = [];
  if (sh && sh.getLastRow() >= 2){
    var values = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues();
    var H = headerIndexMap_(values[0]);
    var iCol = idx_(H,'COLUMNA'), iEt = idx_(H,'ETIQUETA'), iDet = idx_(H,'EN_DETALLE'),
        iOrd = idx_(H,'ORDEN'),   iFmt = idx_(H,'FORMATO'), iProt = idx_(H,'PROTEGIDA');
    for (var i = 1; i < values.length; i++){
      var col = norm_(values[i][iCol]);
      if (!col) continue;
      map[col] = {
        etiqueta:  iEt  > -1 ? String(values[i][iEt]).trim() : '',
        enDetalle: iDet > -1 ? toBool_(values[i][iDet]) : false,
        orden:     iOrd > -1 ? (numOrNull_(values[i][iOrd]) || 0) : 0,
        formato:   iFmt > -1 ? String(values[i][iFmt]).trim() : 'TEXTO',
        protegida: iProt > -1 ? toBool_(values[i][iProt]) : false
      };
      order.push(col);
    }
  }
  order.sort(function(a,b){ return map[a].orden - map[b].orden; });
  var out = { map: map, order: order };
  cache.put('CAMPOS_CFG', JSON.stringify(out), 60); // 60s; se limpia al guardar desde el gestor
  return out;
}
function clearCamposCache_(){ CacheService.getScriptCache().remove('CAMPOS_CFG'); }

/* ---------- CONFIG_CALCULADOS (recetas de campos calculados) ---------- */

function ensureCalculadosSheet_(){
  var ss = ss_();
  var sh = ss.getSheetByName(CONFIG.CALCULADOS_SHEET);
  if (!sh){
    sh = ss.insertSheet(CONFIG.CALCULADOS_SHEET);
    sh.appendRow(CALCULADOS_HEADERS);
  }
  return sh;
}

/** Lee CONFIG_CALCULADOS SIN cache. Devuelve {map (por clave normalizada), order}. */
function readCalculadosRaw_(){
  var sh = ss_().getSheetByName(CONFIG.CALCULADOS_SHEET);
  var map = {}, order = [];
  if (sh && sh.getLastRow() >= 2){
    var values = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues();
    var H = headerIndexMap_(values[0]);
    var iC = idx_(H,'CLAVE'), iT = idx_(H,'TIPO'), iO = idx_(H,'ORIGEN'), iD = idx_(H,'DEFINICION');
    for (var i = 1; i < values.length; i++){
      var clave = String(values[i][iC] == null ? '' : values[i][iC]).trim();
      if (!clave) continue;
      var defRaw = iD > -1 ? String(values[i][iD] == null ? '' : values[i][iD]) : '';
      var def = null, err = '';
      if (defRaw){ try { def = JSON.parse(defRaw); } catch(e){ err = 'json'; } }
      var k = norm_(clave);
      map[k] = {
        clave:      clave,
        tipo:       iT > -1 ? String(values[i][iT]).trim().toLowerCase() : '',
        origen:     iO > -1 ? String(values[i][iO]).trim() : '',
        definicion: def || {},
        error:      err
      };
      order.push(k);
    }
  }
  return { map: map, order: order };
}

/** Versión cacheada (60s) para el render de tarjeta y detalle. */
function readCalculados_(){
  var cache = CacheService.getScriptCache();
  var hit = cache.get('CALC_CFG');
  if (hit) return JSON.parse(hit);
  var out = readCalculadosRaw_();
  cache.put('CALC_CFG', JSON.stringify(out), 60);
  return out;
}
function clearCalculadosCache_(){ CacheService.getScriptCache().remove('CALC_CFG'); }

/** Motor de semáforo: mismo cálculo para tarjeta y detalle (una sola fuente de verdad).
 *  num = valor crudo (fracción, ej. 0.06). `sensible` decide el texto:
 *    sensible=true  -> banda/rango (esconde el número, ej. FPD)
 *    sensible=false -> valor exacto (ej. DIF_REL). El color siempre sale de los cortes.
 *  Devuelve { txt, sem }. */
function semaforoRender_(num, def, tipo, sensible){
  if (num === null || num === undefined) return { txt: 's/d', sem: 'na' };
  var unidad = (def && def.unidad) ? String(def.unidad).toLowerCase() : 'porcentaje';
  var esPct = (unidad === 'porcentaje');
  var vp = esPct ? num * 100 : num;
  var suf = esPct ? '%' : '';
  var valorTxt = esPct ? ((Math.round(vp * 10) / 10) + suf) : String(Math.round(vp));
  var c1 = (def && def.corte1 != null) ? Number(def.corte1) : null;
  var c2 = (def && def.corte2 != null) ? Number(def.corte2) : null;
  if (c1 === null || c2 === null) return { txt: valorTxt, sem: 'na' };
  var bucket, banda;
  if (vp < c1)       { bucket = 'low';  banda = '< ' + c1 + suf; }
  else if (vp <= c2) { bucket = 'mid';  banda = c1 + '\u2013' + c2 + suf; }
  else               { bucket = 'high'; banda = '> ' + c2 + suf; }
  var sem;
  if (tipo === 'semaforo_inv') sem = (bucket === 'low') ? 'bad' : (bucket === 'mid') ? 'warn' : 'ok';
  else                         sem = (bucket === 'low') ? 'ok'  : (bucket === 'mid') ? 'warn' : 'bad';
  return { txt: (sensible ? banda : valorTxt), sem: sem };
}

/* ===== Motor de fórmulas seguro (sin eval). Soporta columnas, números,
 * + - * / ( ) y comparadores > >= < <= == != (comparación => 1/0). ===== */
var _FORMULA_CACHE = {};
function _formulaTree_(expr){ if (!_FORMULA_CACHE[expr]) _FORMULA_CACHE[expr] = parseFormula_(expr); return _FORMULA_CACHE[expr]; }

function tokenizeFormula_(expr){
  var toks = [], i = 0, s = String(expr), two = { '>=':1,'<=':1,'==':1,'!=':1 };
  while (i < s.length){
    var c = s[i];
    if (c === ' ' || c === '\t'){ i++; continue; }
    if (two[s.substr(i,2)]){ toks.push({t:'op',v:s.substr(i,2)}); i += 2; continue; }
    if ('+-*/()<>'.indexOf(c) > -1){ toks.push({t:'op',v:c}); i++; continue; }
    if (/[0-9.]/.test(c)){ var j=i; while (j<s.length && /[0-9.]/.test(s[j])) j++; toks.push({t:'num',v:parseFloat(s.substring(i,j))}); i=j; continue; }
    if (/[A-Za-z_]/.test(c)){ var k=i; while (k<s.length && /[A-Za-z0-9_]/.test(s[k])) k++; toks.push({t:'id',v:s.substring(i,k)}); i=k; continue; }
    throw new Error('Caracter no válido: "' + c + '"');
  }
  return toks;
}
function parseFormula_(expr){
  var toks = tokenizeFormula_(expr), pos = 0;
  function peek(){ return toks[pos]; } function eat(){ return toks[pos++]; }
  function primary(){ var tk = peek(); if (!tk) throw new Error('Fórmula incompleta.');
    if (tk.t==='op' && tk.v==='('){ eat(); var e=comparison(); var r=eat(); if(!r||r.v!==')') throw new Error('Falta ")".'); return e; }
    if (tk.t==='op' && tk.v==='-'){ eat(); return {k:'neg',a:primary()}; }
    if (tk.t==='num'){ eat(); return {k:'num',v:tk.v}; }
    if (tk.t==='id'){ eat(); return {k:'col',v:tk.v}; }
    throw new Error('Token inesperado: ' + tk.v); }
  function term(){ var a=primary(); while(peek() && peek().t==='op' && (peek().v==='*'||peek().v==='/')){ var op=eat().v; a={k:op,a:a,b:primary()}; } return a; }
  function arith(){ var a=term(); while(peek() && peek().t==='op' && (peek().v==='+'||peek().v==='-')){ var op=eat().v; a={k:op,a:a,b:term()}; } return a; }
  function comparison(){ var a=arith(); if(peek() && peek().t==='op' && ['>','>=','<','<=','==','!='].indexOf(peek().v)>-1){ var op=eat().v; a={k:'cmp',op:op,a:a,b:arith()}; } return a; }
  var tree = comparison(); if (pos < toks.length) throw new Error('Sobra al final: ' + toks[pos].v); return tree;
}
function formulaCols_(node, acc){ acc = acc || []; if (!node) return acc; if (node.k==='col'){ acc.push(node.v); return acc; } formulaCols_(node.a,acc); formulaCols_(node.b,acc); return acc; }
function evalFormulaNode_(node, getCol){
  switch(node.k){
    case 'num': return node.v;
    case 'col': return numOrNull_(getCol(node.v));
    case 'neg': { var a=evalFormulaNode_(node.a,getCol); return a==null?null:-a; }
    case '+': case '-': case '*': case '/': {
      var x=evalFormulaNode_(node.a,getCol), y=evalFormulaNode_(node.b,getCol);
      if (x==null||y==null) return null;
      if (node.k==='+') return x+y; if (node.k==='-') return x-y; if (node.k==='*') return x*y;
      return y===0 ? null : x/y; }
    case 'cmp': { var l=evalFormulaNode_(node.a,getCol), r=evalFormulaNode_(node.b,getCol); if (l==null||r==null) return null;
      switch(node.op){ case '>':return l>r?1:0; case '>=':return l>=r?1:0; case '<':return l<r?1:0; case '<=':return l<=r?1:0; case '==':return l===r?1:0; case '!=':return l!==r?1:0; } }
  }
  throw new Error('Nodo desconocido');
}
function computeFormula_(expr, row, HM){ if (!expr) return null; return evalFormulaNode_(_formulaTree_(expr), function(name){ var i=idx_(HM,name); return i>-1 ? row[i] : ''; }); }

// Devuelve el valor numérico de un origen, sea columna real o campo 'formula' (encadenado un nivel).
function resolveOrigenNum_(origen, row, HM, calcData){
  var i = idx_(HM, origen);
  if (i > -1) return numOrNull_(row[i]);
  var c = (calcData && calcData.map) ? calcData.map[norm_(origen)] : null;
  if (c && c.tipo === 'formula' && c.definicion) return computeFormula_(c.definicion.formula, row, HM);
  return null;
}

/** ¿La columna es sensible (PROTEGIDA=true en CONFIG_CAMPOS)? Default: no sensible. */
function esSensible_(campos, colName){
  var c = campos.map[norm_(colName)];
  return c ? !!c.protegida : false;
}

/** Aplica una receta calculada sobre una fila de datos. Devuelve { v, sem? }. */
function computeCalculado_(calc, row, HM, sensible, calcData){
  var tipo = String(calc.tipo || '').toLowerCase();
  var def = calc.definicion || {};
  if (tipo === 'concatenado'){
    var cols = (def.columnas && def.columnas.length) ? def.columnas : (calc.origen ? [calc.origen] : []);
    var sep = (def.separador != null) ? String(def.separador) : ' - ';
    var parts = [];
    for (var i = 0; i < cols.length; i++){ var ci = idx_(HM, cols[i]); if (ci < 0) continue; var s = String(row[ci] == null ? '' : row[ci]).trim(); if (s) parts.push(s); }
    return { v: parts.join(sep) };
  }
  if (tipo === 'formula'){ var val = computeFormula_(def.formula, row, HM); return { v: val == null ? '\u2014' : val }; }
  // semaforo / semaforo_inv: el origen puede ser columna real O un campo 'formula'
  var num = resolveOrigenNum_(calc.origen, row, HM, calcData);
  if (num === null){ var oi = idx_(HM, calc.origen); if (oi < 0 && !(calcData && calcData.map && calcData.map[norm_(calc.origen)])) return { v: '\u2014', sem: 'na' }; }
  var r = semaforoRender_(num, def, tipo, sensible);
  return { v: r.txt, sem: r.sem };
}

/** Busca la receta de semáforo (normal o invertido) cuyo ORIGEN sea la columna dada. */
function findSemCalcByOrigen_(calcData, origenCol){
  var o = norm_(origenCol);
  for (var k in calcData.map){
    var c = calcData.map[k];
    if ((c.tipo === 'semaforo' || c.tipo === 'semaforo_inv') && norm_(c.origen) === o) return c;
  }
  return null;
}

/** Formatea un valor para el detalle según FORMATO. */
function formatVal_(v, formato){
  if (v === null || v === undefined || v === '') return '';
  switch (norm_(formato)){
    case 'PORCENTAJE': { var p = numOrNull_(v); return p === null ? String(v) : (Math.round(p*1000)/10) + '%'; }
    case 'DECIMAL':    { var d = numOrNull_(v); return d === null ? String(v) : (Math.round(d*100)/100); }
    case 'ENTERO':     { var e = numOrNull_(v); return e === null ? String(v) : Math.round(e); }
    case 'FECHA':
      if (v instanceof Date) return Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm');
      return String(v);
    default: return String(v); // TEXTO
  }
}

/* ---------- API para el frontend ---------- */

function fuse_(a, b) {
  a = String(a == null ? '' : a).trim();
  b = String(b == null ? '' : b).trim();
  return (a && b) ? (a + ' - ' + b) : (a || b);
}

/* ================================================================
 * ============  CARGA UNIFICADA (una sola lectura)  ==============
 * ================================================================
 * getBootstrap lee las ~10k filas de Tiendas UNA vez y en esa misma pasada
 * arma dos cosas sobre el mismo array:
 *   - stores  : idéntico a lo que devolvía getStores (tarjetas)
 *   - resumen : idéntico a lo que devolvía getResumen (KPIs + seguimiento + críticas)
 * Cachea la salida ya procesada por alcance (rol + correo + viewAs), 3 min.
 * Ejecutivo/supervisor: paquete chico -> cachea -> 2ª carga instantánea.
 * Maestro: paquete grande -> el put puede exceder el límite y no cachear (ok,
 * es una sola llamada por sesión de todos modos). */
function getBootstrap(viewAsEmail){
  var caller = activeEmail_();
  var callerRole = roleOf_(caller);

  var vkey = viewAsEmail ? String(viewAsEmail).trim().toLowerCase() : '';
  var cache = CacheService.getScriptCache();
  var ckey = 'BOOT2_' + callerRole + '|' + caller + '|' + vkey;
  var hit = cache.get(ckey);
  if (hit){ try { return JSON.parse(hit); } catch(e){} }

  // ---- Lectura ÚNICA de Tiendas (encabezados + filas, ancho completo) ----
  var sheet = mainSheet_();
  var lastRow = sheet.getLastRow(), lastCol = sheet.getLastColumn();
  var headers = getHeadersCached_(sheet, lastCol);
  var HM = headerIndexMap_(headers);
  var values = (lastRow >= 2) ? sheet.getRange(2, 1, lastRow - 1, lastCol).getValues() : [];

  var out = {
    stores:  _buildStores_(caller, callerRole, viewAsEmail, headers, values, HM),
    resumen: _buildResumen_(caller, callerRole, viewAsEmail, values, HM)
  };

  try { cache.put(ckey, JSON.stringify(out), 180); } catch (e){}  // 3 min
  return out;
}

// Envoltorios de compatibilidad: si algo aún llama a getStores/getResumen
// sueltos, siguen funcionando y reusan la MISMA lectura (vía la caché).
function getStores(viewAsEmail){ return getBootstrap(viewAsEmail).stores; }
function getResumen(viewAsEmail){ return getBootstrap(viewAsEmail).resumen; }

/* ---------- Constructor de TIENDAS (sobre un array ya leído) ---------- */
function _buildStores_(caller, callerRole, viewAsEmail, headers, values, HM){
  if (!hasAccess_(callerRole))
    return { email: caller, role: callerRole, viewingAs: null, viewingRole: callerRole, config: publicConfig(), rows: [] };

  var scopeOwner = null, scopeSup = null, impersonating = null, viewingRole = callerRole;
  if (callerRole === 'usuario')         scopeOwner = caller;
  else if (callerRole === 'supervisor') scopeSup = caller;

  if (viewAsEmail) {
    var t = String(viewAsEmail).trim().toLowerCase();
    if (callerRole === 'maestro') {
      var tr = roleOf_(t);
      scopeOwner = null; scopeSup = null; impersonating = t; viewingRole = tr;
      if (tr === 'usuario')         scopeOwner = t;
      else if (tr === 'supervisor') scopeSup = t;
      else if (!hasAccess_(tr))
        return { email: caller, role: callerRole, viewingAs: t, viewingRole: tr, config: publicConfig(), rows: [] };
    } else if (callerRole === 'supervisor') {
      scopeOwner = t; scopeSup = caller; impersonating = t; viewingRole = 'usuario';
    }
  }

  var base = { email: caller, role: callerRole, viewingAs: impersonating, viewingRole: viewingRole, config: publicConfig(), rows: [] };
  if (!values.length) return base;

  var iOwner = idx_(HM, CONFIG.EMAIL_COL);
  if (iOwner === -1) throw new Error('No existe la columna "' + CONFIG.EMAIL_COL + '". Encontradas: ' + headers.join(' | '));
  var iSup=idx_(HM,'MANAGER'), iProc=idx_(HM,'PROCEDENCIA'), iHab=idx_(HM,'HABILITADO'), iTipo=idx_(HM,'TIPO_TIENDA');
  var iMid=idx_(HM,'MERCHANTID'), iMn=idx_(HM,'MERCHANTNAME'), iAid=idx_(HM,'ADMINID'), iAn=idx_(HM,'ADMINNAME');
  var iVT=idx_(HM,'VENTA_TOTAL'), iVR1=idx_(HM,'VENTA_R_1'), iDif=idx_(HM,'DIF_REL'), iVis=idx_(HM,'VISITAS');

  // Recetas de semáforo (una sola fuente de verdad, compartida con el detalle).
  var calcData = readCalculados_();
  var calcF7  = findSemCalcByOrigen_(calcData, 'FPD7');
  var calcF15 = findSemCalcByOrigen_(calcData, 'FPD15');
  var calcDif = findSemCalcByOrigen_(calcData, 'DIF_REL');
  // Sensibilidad de cada origen (decide banda vs valor exacto).
  var campos = readCampos_();
  var sensF7  = esSensible_(campos, 'FPD7');   // sensible -> banda
  var sensF15 = esSensible_(campos, 'FPD15');  // sensible -> banda
  var sensDif = esSensible_(campos, 'DIF_REL');        // no sensible -> valor exacto

  var rows = [];
  for (var r = 0; r < values.length; r++) {
    var v = values[r];
    if (scopeOwner !== null && String(v[iOwner]).trim().toLowerCase() !== scopeOwner) continue;
    if (scopeSup   !== null && (iSup < 0 || String(v[iSup]).trim().toLowerCase() !== scopeSup)) continue;

    var f7  = resolveOrigenNum_('FPD7',  v, HM, calcData);
    var f15 = resolveOrigenNum_('FPD15', v, HM, calcData);
    var vt  = numOrNull_(iVT  > -1 ? v[iVT]  : '');
    var dif = numOrNull_(iDif > -1 ? v[iDif] : '');
    var vis = numOrNull_(iVis > -1 ? v[iVis] : '');
    var tipo = iTipo > -1 ? String(v[iTipo]).trim() : '';

    // Dif. mensual: semáforo sobre DIF_REL (valor exacto, porque DIF_REL no es sensible).
    var difSem = calcDif
      ? semaforoRender_(dif, calcDif.definicion, calcDif.tipo, sensDif)
      : { txt: (dif === null ? 's/d' : String(Math.round(dif))), sem: 'na' };

    rows.push({
      _row: r + 2,
      merchant: fuse_(iMid > -1 ? v[iMid] : '', iMn > -1 ? v[iMn] : ''),
      admin:    fuse_(iAid > -1 ? v[iAid] : '', iAn > -1 ? v[iAn] : ''),
      owner:       iOwner > -1 ? v[iOwner] : '',
      supervisor:  iSup  > -1 ? v[iSup]  : '',
      procedencia: iProc > -1 ? v[iProc] : '',
      habilitado:  iHab  > -1 ? String(v[iHab]).trim() : '',
      tipo: tipo,
      churn: tipo.toUpperCase() === 'CHURN',
      ventaMes: vt === null ? '\u2014' : String(Math.round(vt)),   // "Ventas": solo valor, sin color
      dif:  difSem,                                                 // "Dif. mensual": semáforo
      fpd7:  calcF7  ? semaforoRender_(f7,  calcF7.definicion,  calcF7.tipo,  sensF7)  : { txt: 's/d', sem: 'na' },
      fpd15: calcF15 ? semaforoRender_(f15, calcF15.definicion, calcF15.tipo, sensF15) : { txt: 's/d', sem: 'na' },
      borde: difSem.sem === 'bad',       // borde rojo si Dif. mensual está en rojo
      sinVisita: SEM.BADGE_VISITAS && vis === 0
    });
  }
  base.rows = rows;
  return base;
}

/* ---------- Vendedores por tienda (pestaña Clerks, empaquetada en JSON) ---------- */

/** Normaliza un id para comparar parejo (280461.0 -> 280461). */
function normId_(v){
  if (v === null || v === undefined) return '';
  return String(v).trim().replace(/\.0+$/, '');
}

/** Lee UNA fila de Clerks por merchantid (TextFinder, sin cargar toda la pestaña)
 *  y arma la lista de vendedores. El semáforo de FPD7 reusa la receta de
 *  CONFIG_CALCULADOS (misma fuente de verdad que la tarjeta y el detalle). */
function clerksForMerchant_(merchantId){
  merchantId = normId_(merchantId);
  if (!merchantId) return [];
  var sh = ss_().getSheetByName('Clerks');
  if (!sh) return [];
  var last = sh.getLastRow();
  if (last < 2) return [];

  var head = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0];
  var H = headerIndexMap_(head);
  var cMid  = idx_(H, 'MERCHANT_ID');
  var cJson = idx_(H, 'CLERKS');
  if (cMid < 0 || cJson < 0) return [];

  var cell = sh.getRange(2, cMid + 1, last - 1, 1)
               .createTextFinder(merchantId).matchEntireCell(true).findNext();
  if (!cell) return [];

  var raw = sh.getRange(cell.getRow(), cJson + 1).getValue();
  var arr = [];
  try { arr = raw ? JSON.parse(raw) : []; } catch (e){ arr = []; }

  var calcData = readCalculados_();
  var calcF7   = findSemCalcByOrigen_(calcData, 'FPD7');
  var campos   = readCampos_();
  var sensF7   = esSensible_(campos, 'FPD7');   // misma sensibilidad que el FPD7 de la tienda
  var meId = merchantId;  // el de la tienda abierta, ya normalizado arriba
  
  return arr.map(function(c){
    var num = (c.FPD7 === null || c.FPD7 === undefined || c.FPD7 === '') ? null : Number(c.FPD7);
    var r = calcF7
      ? semaforoRender_(num, calcF7.definicion, calcF7.tipo, sensF7)
      : { txt: (num === null ? 's/d' : (Math.round(num * 1000) / 10) + '%'), sem: 'na' };
    var nombre = String(c.nombre == null ? '' : c.nombre).trim() || '\u2014\u2014\u2014';
    var actual = normId_(c.actual);
    var movido = (actual && actual !== meId) ? actual : '';   // vacío si sigue aquí
    return { nombre: nombre, und: c.und || 0, sem: r.sem, mora: r.txt,
             activo: (c.activo === undefined ? true : !!c.activo), movido: movido };
  });
}

/** Detalle de una tienda gobernado por CONFIG_CAMPOS. Revalida permisos. */
function getStoreDetail(rowNumber, viewAsEmail) {
  rowNumber = parseInt(rowNumber, 10);
  if (!rowNumber || rowNumber < 2) throw new Error('Fila inválida.');

  var caller = activeEmail_();
  var callerRole = roleOf_(caller);
  if (!hasAccess_(callerRole)) throw new Error('Sin acceso.');

  var sheet = mainSheet_();
  var lastCol = sheet.getLastColumn();
  var headers = getHeadersCached_(sheet, lastCol);
  var HM = headerIndexMap_(headers);
  var iOwner = idx_(HM, CONFIG.EMAIL_COL);
  var iSup   = idx_(HM, 'MANAGER');
  var row = sheet.getRange(rowNumber, 1, 1, lastCol).getValues()[0];
  var rowOwner = iOwner > -1 ? String(row[iOwner]).trim().toLowerCase() : '';
  var rowSup   = iSup   > -1 ? String(row[iSup]).trim().toLowerCase()   : '';

  var t = viewAsEmail ? String(viewAsEmail).trim().toLowerCase() : null;
  var allowed = false;
  if (callerRole === 'admin' || callerRole === 'maestro') {
    if (t && callerRole === 'maestro') {
      var tr = roleOf_(t);
      if (tr === 'admin' || tr === 'maestro') allowed = true;
      else if (tr === 'supervisor') allowed = (rowSup === t);
      else if (tr === 'usuario')    allowed = (rowOwner === t);
    } else allowed = true;
  } else if (callerRole === 'supervisor') {
    allowed = t ? (rowOwner === t && rowSup === caller) : (rowSup === caller);
  } else { // usuario
    allowed = (rowOwner === caller);
  }
  if (!allowed) throw new Error('No autorizado para ver esta tienda.');

  // Valores de apoyo (título y botón Zoho), independientes de la config.
  var zohoAccountId = '', midId = '', midName = '';
  for (var c = 0; c < headers.length; c++){
    var nh = norm_(headers[c]);
    if (nh === 'ZOHO_ACCOUNT_ID') zohoAccountId = row[c];
    else if (nh === 'MERCHANTID') midId = row[c];
    else if (nh === 'MERCHANTNAME') midName = row[c];
  }

  var clerks = clerksForMerchant_(midId);   // vendedores de esta tienda

  var campos = readCampos_();            // { map, order }
  var calculados = readCalculados_();    // { map, order }
  var fields = [];

  if (!campos.order || !campos.order.length){
    // Red de seguridad: sin config, muestra todas las columnas reales.
    for (var c2 = 0; c2 < headers.length; c2++){
      fields.push({ k: headers[c2], v: formatVal_(row[c2], 'TEXTO') });
    }
    return { title: fuse_(midId, midName) || 'Detalle', fields: fields, zohoAccountId: zohoAccountId, clerks: clerks };
  }

  // La config manda el orden y la visibilidad. Cada fila es columna real o calculada.
  for (var i = 0; i < campos.order.length; i++){
    var clave = campos.order[i];
    var cfg = campos.map[clave];
    if (!cfg || !cfg.enDetalle) continue;

    var ih = idx_(HM, clave);
    if (ih > -1){
      // columna real de Tiendas
      fields.push({ k: cfg.etiqueta || headers[ih], v: formatVal_(row[ih], cfg.formato) });
    } else if (calculados.map[clave]){
      // campo calculado: se resuelve con su receta. El display (banda vs valor) depende
      // de si su columna origen es sensible (PROTEGIDA) en CONFIG_CAMPOS.
      var calc = calculados.map[clave];
      var sens = calc.origen ? esSensible_(campos, calc.origen) : false;
      var out = computeCalculado_(calc, row, HM, sens, calculados);
      var f = { k: cfg.etiqueta || calc.clave, v: out.v };
      if (out.sem) f.sem = out.sem;
      fields.push(f);
    }
    // si no es ni real ni calculada => huérfana => no se muestra
  }

  return { title: fuse_(midId, midName) || 'Detalle', fields: fields, zohoAccountId: zohoAccountId, clerks: clerks };
}

/** Cachea los encabezados de la hoja de tiendas (evita una lectura por click). */
function getHeadersCached_(sheet, lastCol) {
  const cache = CacheService.getScriptCache();
  const key = 'HDRS_' + CONFIG.SHEET_NAME + '_' + lastCol;   // cambia si cambia el nº de columnas
  const hit = cache.get(key);
  if (hit) return JSON.parse(hit);
  const headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(function (h) { return String(h).trim(); });
  cache.put(key, JSON.stringify(headers), 120); // 2 min: un rename se refleja pronto sin leer de más
  return headers;
}

function publicConfig() {
  return { TITLE_COL: CONFIG.TITLE_COL, CARD_COLS: CONFIG.CARD_COLS };
}

/** Solo maestro: lista de usuarios y roles. Incluye siempre al maestro fijo. */
function getAdminData() {
  requireMaestro_();
  const users = readUsers_();
  const mf = CONFIG.MAESTRO_FALLBACK.trim().toLowerCase();
  const list = users.list.slice();
  if (!users.map[mf]) list.unshift({ correo: mf, rol: 'maestro', estado: 'ACTIVO' });
  return { roles: list, rolesValidos: ROLES_VALIDOS, maestro: mf };
}

/** Solo maestro: crea o actualiza el rol de un correo. */
function setUserRole(email, role) {
  requireMaestro_();
  email = String(email || '').trim().toLowerCase();
  role  = String(role || '').trim().toLowerCase();
  if (!email) throw new Error('Correo vacío.');
  if (ROLES_VALIDOS.indexOf(role) === -1) throw new Error('Rol inválido: ' + role);

  var sh = ensureUsersSheet_();
  var values = sh.getDataRange().getValues();
  var H = headerIndexMap_(values[0]);
  var eIdx = idx_(H, CONFIG.USERS_EMAIL);
  var rIdx = idx_(H, CONFIG.USERS_ROLE);
  for (var i = 1; i < values.length; i++) {
    if (String(values[i][eIdx]).trim().toLowerCase() === email) {
      sh.getRange(i + 1, rIdx + 1).setValue(role);
      clearUsersCache_();
      return getAdminData();
    }
  }
  var headers = values[0].map(function (h) { return String(h).trim(); });
  sh.appendRow(headers.map(function (h) {
    var nh = norm_(h);
    if (nh === norm_(CONFIG.USERS_EMAIL))  return email;
    if (nh === norm_(CONFIG.USERS_ROLE))   return role;
    if (nh === norm_(CONFIG.USERS_ESTADO)) return 'ACTIVO';
    if (nh === 'FECHA_ALTA')               return new Date();
    return '';
  }));
  clearUsersCache_();
  return getAdminData();
}

function getSupervisorUsers() {
  var caller = activeEmail_();
  var role = roleOf_(caller);
  if (role !== 'supervisor' && role !== 'maestro') throw new Error('Requiere rol supervisor.');

  var sheet = mainSheet_();
  var lastRow = sheet.getLastRow(), lastCol = sheet.getLastColumn();
  var headers = getHeadersCached_(sheet, lastCol);
  var HM = headerIndexMap_(headers);
  var iOwner = idx_(HM, CONFIG.EMAIL_COL);
  var iSup   = idx_(HM, 'MANAGER');
  var set = {};
  if (lastRow >= 2 && iSup > -1) {
    // Solo necesita EJECUTIVO y MANAGER (columnas iniciales): acota la lectura.
    var readCols = Math.max(iOwner, iSup) + 1;
    var values = sheet.getRange(2, 1, lastRow - 1, (readCols > 0 ? readCols : lastCol)).getValues();
    for (var r = 0; r < values.length; r++) {
      if (String(values[r][iSup]).trim().toLowerCase() === caller) {
        var o = String(values[r][iOwner]).trim().toLowerCase();
        if (o) set[o] = true;
      }
    }
  }
  var list = Object.keys(set).sort().map(function (e) { return { correo: e }; });
  return { mode: 'supervisor', roles: list };
}

/** Lee CONFIG_CAMPOS SIN cache (el gestor debe ver el estado real, no el cacheado). */
function readCamposRaw_(){
  var sh = ensureCamposSheet_();
  var map = {}, order = [];
  if (sh.getLastRow() >= 2){
    var values = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues();
    var H = headerIndexMap_(values[0]);
    var iCol=idx_(H,'COLUMNA'), iEt=idx_(H,'ETIQUETA'), iDet=idx_(H,'EN_DETALLE'),
        iOrd=idx_(H,'ORDEN'), iFmt=idx_(H,'FORMATO'), iProt=idx_(H,'PROTEGIDA');
    for (var i=1;i<values.length;i++){
      var col = norm_(values[i][iCol]);
      if (!col) continue;
      map[col] = {
        original:  String(values[i][iCol] == null ? '' : values[i][iCol]).trim(),
        etiqueta:  iEt  > -1 ? String(values[i][iEt]).trim() : '',
        enDetalle: iDet > -1 ? toBool_(values[i][iDet]) : false,
        orden:     iOrd > -1 ? (numOrNull_(values[i][iOrd]) || 0) : 0,
        formato:   iFmt > -1 ? (String(values[i][iFmt]).trim() || 'TEXTO') : 'TEXTO',
        protegida: iProt > -1 ? toBool_(values[i][iProt]) : false
      };
      order.push(col);
    }
  }
  return { map: map, order: order };
}

/** Solo maestro: estado del gestor = cruce de headers reales x CONFIG_CAMPOS x CONFIG_CALCULADOS. */
function getCamposManager(){
  requireMaestro_();
  var sheet = mainSheet_();
  var lastCol = sheet.getLastColumn();
  // Headers FRESH (sin cache) para que una columna recién agregada aparezca de una.
  var headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h){ return String(h).trim(); });
  var headSet = {}; headers.forEach(function(h){ headSet[norm_(h)] = h; });

  var cfg  = readCamposRaw_();       // { map, order }
  var calc = readCalculadosRaw_();   // { map, order }

  function isHeader(k){ return headSet[k] !== undefined; }
  function isCalc(k){ return calc.map[k] !== undefined; }
  // Alerta de receta: JSON inválido, u origen que ya no existe en Tiendas.
  function alertaCalc(k){
    var cc = calc.map[k]; if (!cc) return '';
    if (cc.error === 'json') return 'receta inválida';
    if (cc.tipo === 'formula'){
      try { var cols = formulaCols_(parseFormula_(cc.definicion.formula));
        for (var i=0;i<cols.length;i++){ if (!isHeader(norm_(cols[i]))) return 'columna no encontrada: ' + cols[i]; }
      } catch(e){ return 'fórmula inválida'; }
      return '';
    }
    if (cc.tipo === 'semaforo' || cc.tipo === 'semaforo_inv'){
      if (cc.origen && !isHeader(norm_(cc.origen)) && !calc.map[norm_(cc.origen)]) return 'origen no encontrado: ' + cc.origen;
      return '';
    }
    if (cc.origen && !isHeader(norm_(cc.origen))) return 'origen no encontrado: ' + cc.origen;
    return '';
  }
  function displayName(k){ return isHeader(k) ? headSet[k] : (isCalc(k) ? calc.map[k].clave : k); }

  var items = [], enConfig = {};

  // 1) En config (columna real o calculada), en su ORDEN.
  var pres = cfg.order.filter(function(k){ return isHeader(k) || isCalc(k); });
  pres.sort(function(a,b){ return cfg.map[a].orden - cfg.map[b].orden; });
  pres.forEach(function(k){
    var m = cfg.map[k];
    enConfig[k] = true;
    items.push({ columna: displayName(k), etiqueta: m.etiqueta, enDetalle: m.enDetalle,
                 formato: m.formato, protegida: m.protegida,
                 estado: isCalc(k) ? 'calculado' : 'ok', alerta: isCalc(k) ? alertaCalc(k) : '' });
  });

  // 2) Columnas reales nuevas (en Tiendas, sin config). Default oculto/TEXTO.
  headers.forEach(function(h){
    if (!enConfig[norm_(h)]){
      items.push({ columna: h, etiqueta: '', enDetalle: false,
                   formato: 'TEXTO', protegida: false, estado: 'nueva', alerta: '' });
    }
  });

  // 3) Calculados nuevos (existe la receta, aún no están en la config).
  calc.order.forEach(function(k){
    if (!enConfig[k]){
      items.push({ columna: calc.map[k].clave, etiqueta: '', enDetalle: false,
                   formato: 'TEXTO', protegida: false, estado: 'calculado_nuevo', alerta: alertaCalc(k) });
    }
  });

  // 4) Huérfanas: en config, ni columna real ni calculado. El maestro decide.
  //    Pista de origen por convención de nombre (calculado = tiene minúscula/espacio; columna real = MAYÚSCULAS_CON_GUION).
  cfg.order.forEach(function(k){
    if (!isHeader(k) && !isCalc(k)){
      var m = cfg.map[k];
      var pareceCalc = /[a-z ]/.test(m.original || '');
      items.push({ columna: (m.original || k), etiqueta: m.etiqueta, enDetalle: m.enDetalle,
                   formato: m.formato, protegida: m.protegida, estado: 'huerfana',
                   sub: pareceCalc ? 'calculado' : 'columna', alerta: '' });
    }
  });

  return {
    items: items,
    formatos: FORMATOS_VALIDOS,
    columnasReales: headers,
    tipos: TIPOS_CALCULADOS,
    unidades: ['porcentaje', 'numero'],
    recetas: calc.order.map(function(k){
      var c = calc.map[k];
      return { clave: c.clave, tipo: c.tipo, origen: c.origen, definicion: c.definicion };
    })
  };
}

/** Solo maestro: reescribe CONFIG_CAMPOS con el orden y valores recibidos del gestor. */
function saveCampos(items){
  requireMaestro_();
  if (!items || !items.length) throw new Error('No hay campos para guardar.');
  var sh = ensureCamposSheet_();

  var rows = [CAMPOS_HEADERS.slice()];
  for (var i=0;i<items.length;i++){
    var it = items[i] || {};
    var col = String(it.columna == null ? '' : it.columna).trim();
    if (!col) continue;
    var fmt = norm_(it.formato);
    if (FORMATOS_VALIDOS.indexOf(fmt) === -1) fmt = 'TEXTO';
    rows.push([ col,
                String(it.etiqueta == null ? '' : it.etiqueta).trim(),
                it.enDetalle ? true : false,
                (i + 1) * 10,               // ORDEN renumerado según la posición de arrastre
                fmt,
                it.protegida ? true : false ]);
  }

  sh.clearContents();
  sh.getRange(1, 1, rows.length, CAMPOS_HEADERS.length).setValues(rows);
  clearCamposCache_();
  return getCamposManager();
}

/** Agrega una fila oculta en CONFIG_CAMPOS para la clave dada, si aún no existe. */
function ensureCampoRow_(clave){
  var sh = ensureCamposSheet_();
  var values = sh.getDataRange().getValues();
  var H = headerIndexMap_(values[0]);
  var iCol = idx_(H,'COLUMNA'), iEt = idx_(H,'ETIQUETA'), iDet = idx_(H,'EN_DETALLE'),
      iOrd = idx_(H,'ORDEN'), iFmt = idx_(H,'FORMATO'), iProt = idx_(H,'PROTEGIDA');
  var maxOrd = 0;
  for (var r = 1; r < values.length; r++){
    if (norm_(values[r][iCol]) === norm_(clave)) return; // ya existe
    var o = numOrNull_(values[r][iOrd]); if (o !== null && o > maxOrd) maxOrd = o;
  }
  var width = values[0].length, row = [];
  for (var k = 0; k < width; k++) row[k] = '';

  if (iDet  > -1) row[iDet]  = false;

  if (iFmt  > -1) row[iFmt]  = 'TEXTO';
  if (iProt > -1) row[iProt] = false;
  sh.appendRow(row);
}

/** Solo maestro: crea o edita una receta en CONFIG_CALCULADOS. Valida tipo, origen y cortes. */
function saveCalculado(payload){
  requireMaestro_();
  payload = payload || {};
  var clave = String(payload.clave == null ? '' : payload.clave).trim();
  var claveOrig = String(payload.claveOriginal == null ? '' : payload.claveOriginal).trim();
  var tipo = String(payload.tipo || '').trim().toLowerCase();
  if (!clave) throw new Error('El nombre interno (clave) es obligatorio.');
  if (TIPOS_CALCULADOS.indexOf(tipo) === -1) throw new Error('Tipo inválido: ' + tipo);

  var headers = calcHeaders_();
  var HS = {}; headers.forEach(function(h){ HS[norm_(h)] = true; });
  function esColReal(name){ return HS[norm_(name)] === true; }
  var calcNow = readCalculadosRaw_();
  function esFormulaClave(name){ var c = calcNow.map[norm_(name)]; return !!(c && c.tipo === 'formula'); }

  var def = {}, origen = '';
  if (tipo === 'concatenado'){
    var cols = (payload.columnas || []).map(function(c){ return String(c || '').trim(); }).filter(function(c){ return c; });
    if (!cols.length) throw new Error('Elige al menos una columna para concatenar.');
    for (var i = 0; i < cols.length; i++){ if (!esColReal(cols[i])) throw new Error('La columna "' + cols[i] + '" no existe en Tiendas.'); }
    def = { columnas: cols, separador: (payload.separador == null) ? ' - ' : String(payload.separador) }; origen = cols[0];
  } else if (tipo === 'formula'){
    var expr = String(payload.formula || '').trim();
    if (!expr) throw new Error('Escribe la fórmula.');
    var tree; try { tree = parseFormula_(expr); } catch(e){ throw new Error('Fórmula inválida: ' + e.message); }
    var fcols = formulaCols_(tree);
    for (var f = 0; f < fcols.length; f++){ if (!esColReal(fcols[f])) throw new Error('La columna "' + fcols[f] + '" no existe en Tiendas.'); }
    def = { formula: expr }; origen = fcols[0] || '';
  } else { // semaforo / semaforo_inv
    origen = String(payload.origen || '').trim();
    if (!esColReal(origen) && !esFormulaClave(origen)) throw new Error('El origen "' + origen + '" no es una columna real ni un campo calculado.');
    var unidad = String(payload.unidad || 'porcentaje').trim().toLowerCase();
    if (unidad !== 'porcentaje' && unidad !== 'numero') unidad = 'porcentaje';
    var c1 = numOrNull_(payload.corte1), c2 = numOrNull_(payload.corte2);
    if (c1 === null || c2 === null) throw new Error('Los dos cortes son obligatorios y numéricos.');
    if (c1 >= c2) throw new Error('El corte verde→ámbar debe ser menor que el corte ámbar→rojo.');
    def = { unidad: unidad, corte1: c1, corte2: c2 };
  }

  var sh = ensureCalculadosSheet_();
  var values = sh.getDataRange().getValues();
  var H = headerIndexMap_(values[0]);
  var iC = idx_(H,'CLAVE'), iT = idx_(H,'TIPO'), iO = idx_(H,'ORIGEN'), iD = idx_(H,'DEFINICION');

  if (tipo === 'semaforo' || tipo === 'semaforo_inv'){
    for (var d = 1; d < values.length; d++){
      var dt = String(values[d][iT]).trim().toLowerCase(), dclave = String(values[d][iC]).trim();
      if ((dt === 'semaforo' || dt === 'semaforo_inv') && norm_(values[d][iO]) === norm_(origen) && norm_(dclave) !== norm_(claveOrig))
        throw new Error('Ya existe un semáforo para "' + origen + '" (' + dclave + '). Edítalo en vez de crear otro.');
    }
  }
  var editing = false, rowIdx = -1;
  if (claveOrig){ for (var r = 1; r < values.length; r++){ if (norm_(values[r][iC]) === norm_(claveOrig)){ editing = true; rowIdx = r; break; } } }
  if (editing){
    sh.getRange(rowIdx + 1, iT + 1).setValue(tipo);
    sh.getRange(rowIdx + 1, iO + 1).setValue(origen);
    sh.getRange(rowIdx + 1, iD + 1).setValue(JSON.stringify(def));
  } else {
    for (var r2 = 1; r2 < values.length; r2++){ if (norm_(values[r2][iC]) === norm_(clave)) throw new Error('Ya existe un calculado con ese nombre.'); }
    if (esColReal(clave)) throw new Error('El nombre choca con una columna real de Tiendas. Usa otro.');
    var width = values[0].length, newRow = []; for (var k = 0; k < width; k++) newRow[k] = '';
    if (iC > -1) newRow[iC] = clave; if (iT > -1) newRow[iT] = tipo; if (iO > -1) newRow[iO] = origen; if (iD > -1) newRow[iD] = JSON.stringify(def);
    sh.appendRow(newRow); ensureCampoRow_(clave);
  }
  clearCalculadosCache_(); clearCamposCache_();
  return getCamposManager();
}

/** Solo maestro: borra la receta. La fila en CONFIG_CAMPOS queda huérfana a propósito. */
function deleteCalculado(clave){
  requireMaestro_();
  clave = String(clave || '').trim();
  if (!clave) throw new Error('Clave vacía.');
  var sh = ensureCalculadosSheet_();
  var values = sh.getDataRange().getValues();
  var H = headerIndexMap_(values[0]);
  var iC = idx_(H,'CLAVE');
  for (var r = values.length - 1; r >= 1; r--){
    if (norm_(values[r][iC]) === norm_(clave)){ sh.deleteRow(r + 1); break; }
  }
  clearCalculadosCache_();
  return getCamposManager();
}

/* ---------- Módulo de Visitas (agenda semanal dinámica: ayer + hoy + 5 días) ---------- */

/** Normaliza una fecha (Date o texto) a clave 'yyyy-MM-dd'. */
function toDayKey_(v, tz){
  if (v === null || v === undefined || v === '') return '';
  if (Object.prototype.toString.call(v) === '[object Date]') return Utilities.formatDate(v, tz, 'yyyy-MM-dd');
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  var m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);      // dd/mm/yyyy
  if (m2){ return m2[3] + '-' + ('0'+m2[2]).slice(-2) + '-' + ('0'+m2[1]).slice(-2); }
  return '';
}

/** Visitas de la semana, con alcance por rol igual que Tiendas. */
function getVisitas(viewAsEmail){
  var caller = activeEmail_();
  var callerRole = roleOf_(caller);
  var tz = Session.getScriptTimeZone();
  var DIAS  = ['', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];   // por 'u' (1=Lun..7=Dom)
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  var hoy = new Date();
  var keys = {}, days = [];
  for (var i = -1; i <= 5; i++){
    var dd = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i);
    var key = Utilities.formatDate(dd, tz, 'yyyy-MM-dd');
    var u   = Number(Utilities.formatDate(dd, tz, 'u'));
    var dnum = Utilities.formatDate(dd, tz, 'd');
    var mi  = Number(Utilities.formatDate(dd, tz, 'M'));
    var obj = { fecha: key, label: DIAS[u] + ' ' + dnum + ' ' + MESES[mi-1], esHoy: (i === 0), visitas: [] };
    keys[key] = obj; days.push(obj);
  }
  var base = { email: caller, role: callerRole, days: days };
  if (!hasAccess_(callerRole)) return base;

  // Alcance por rol (mismo criterio que getStores): usuario -> EJECUTIVO, supervisor -> MANAGER.
  var scopeEje = null, scopeMgr = null;
  if (callerRole === 'usuario')         scopeEje = caller;
  else if (callerRole === 'supervisor') scopeMgr = caller;

  // "Ver como" (impersonación), idéntico a Tiendas.
  if (viewAsEmail){
    var t = String(viewAsEmail).trim().toLowerCase();
    if (callerRole === 'maestro'){
      var tr = roleOf_(t);
      scopeEje = null; scopeMgr = null;
      if (tr === 'usuario')         scopeEje = t;
      else if (tr === 'supervisor') scopeMgr = t;
      else if (!hasAccess_(tr))     return base;   // sin acceso
      // admin/maestro impersonado -> todas (ambos null)
    } else if (callerRole === 'supervisor'){
      scopeEje = t; scopeMgr = caller;              // solo un ejecutivo suyo
    }
  }

  var sh = ss_().getSheetByName(CONFIG.VISITAS_SHEET);
  if (!sh || sh.getLastRow() < 2) return base;
  var values = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues();
  var H = headerIndexMap_(values[0]);
  var iId=idx_(H,'ID_INTERACCION'), iMgr=idx_(H,'MANAGER'), iEje=idx_(H,'EJECUTIVO'),
      iMn=idx_(H,'MERCHANTNAME'), iMid=idx_(H,'MERCHANTID'), iTipo=idx_(H,'TIPO_DE_VISITA'),
      iFec=idx_(H,'FECHA_PROGRAMADA'), iEst=idx_(H,'Estado');

  for (var r = 1; r < values.length; r++){
    var row = values[r];
    var eje = iEje > -1 ? String(row[iEje]==null?'':row[iEje]).trim().toLowerCase() : '';
    var mgr = iMgr > -1 ? String(row[iMgr]==null?'':row[iMgr]).trim().toLowerCase() : '';
    if (scopeEje !== null && eje !== scopeEje) continue;
    if (scopeMgr !== null && mgr !== scopeMgr) continue;

    var key2 = toDayKey_(iFec > -1 ? row[iFec] : '', tz);
    if (!key2 || !keys[key2]) continue;   // fuera de la ventana de 7 días

    keys[key2].visitas.push({
      id:         iId  > -1 ? String(row[iId]==null?'':row[iId]).trim() : '',
      merchant:   iMn  > -1 ? String(row[iMn]==null?'':row[iMn]).trim() : '',
      merchantId: iMid > -1 ? String(row[iMid]==null?'':row[iMid]).trim() : '',
      tipo:       iTipo> -1 ? String(row[iTipo]==null?'':row[iTipo]).trim() : '',
      estado:     iEst > -1 ? String(row[iEst]==null?'':row[iEst]).trim() : '',
      ejecutivo:  eje
    });
  }
  return base;
}

/* ---------- Constructor de RESUMEN (sobre el mismo array ya leído) ----------
 * FIX IMPORTANTE: el control de acceso se hace sobre el ROL REAL (callerRole,
 * p. ej. 'usuario'). Antes getResumen convertía usuario->ejecutivo y recién ahí
 * corría hasAccess_, pero esa lista NO incluye 'ejecutivo' -> TODO ejecutivo
 * quedaba bloqueado del Resumen (kpis:null -> spinner infinito). La etiqueta
 * 'ejecutivo' se conserva SOLO para la salida (badge y la condición del
 * Seguimiento que ya tenías). Resultado: el Resumen se muestra a todos; el
 * ejecutivo lo ve sin la tabla de Seguimiento. */
function _buildResumen_(caller, callerRole, viewAsEmail, values, HM){
  if (!hasAccess_(callerRole))
    return { rol: (callerRole === 'usuario' ? 'ejecutivo' : callerRole), blocked: true,
             kpis: null, seguimiento: [], criticas: [], meta: null, universo: 0 };

  var rol = (callerRole === 'usuario') ? 'ejecutivo' : callerRole;  // etiqueta interna del Resumen
  var email = caller;
  var impersonando = false;

  if (viewAsEmail && (rol === 'maestro' || rol === 'admin' || rol === 'supervisor')) {
    var t = String(viewAsEmail).trim().toLowerCase();
    var tr = roleOf_(t); if (tr === 'usuario') tr = 'ejecutivo';
    if (!hasAccess_(roleOf_(t)))
      return { rol: rol, blocked: false, kpis: null, seguimiento: [], criticas: [], meta: getMetaResumen_(), universo: 0 };
    if (rol === 'supervisor') { rol = 'ejecutivo'; email = t; } else { rol = tr; email = t; }
    impersonando = true;
  }

  var ix = HM;
  var visibles = values;
  if (rol === 'ejecutivo')       visibles = values.filter(function (r){ return _rsmLow_(r[ix.EJECUTIVO]) === email; });
  else if (rol === 'supervisor') visibles = values.filter(function (r){ return _rsmLow_(r[ix.MANAGER]) === email; });

  var calcData = readCalculados_();
  var activaTree = null;
  var ac = calcData.map[norm_('ACTIVA')];
  if (ac && ac.tipo === 'formula' && ac.definicion && ac.definicion.formula){ try { activaTree = parseFormula_(ac.definicion.formula); } catch(e){ activaTree = null; } }

  var esTotal = (!impersonando && (rol === 'maestro' || rol === 'admin'));
  var kpis = _rsmKpisDe_(visibles, ix, activaTree, esTotal);

  var seguimiento = [];
  if (rol !== 'ejecutivo') {
    var grupos = {};
    visibles.forEach(function (r){ var e = String(r[ix.EJECUTIVO] || '').trim(); if (!e) return; (grupos[e] = grupos[e] || []).push(r); });
    seguimiento = Object.keys(grupos).map(function (e){
      var k = _rsmKpisDe_(grupos[e], ix, activaTree, false);   // nivel ejecutivo: cuota simple
      return { ejecutivo: e, ventasProyPct: k.ventas.proyPct, activasPct: k.activas.pct, fpd: k.fpd.valor, fpdCumpl: k.fpd.cumpl, vc: k.vc.ratio };
    }).sort(function (a, b){ return (a.ventasProyPct || 0) - (b.ventasProyPct || 0); });
  }

  return { rol: rol, email: email, blocked: false, kpisDef: RESUMEN_KPIS, kpis: kpis, seguimiento: seguimiento,
           criticas: _rsmCriticas_(visibles, ix, rol, calcData), meta: getMetaResumen_(), universo: visibles.length };
}

/* ================= Agregación de KPIs ================= */
function _rsmKpisDe_(filas, ix, activaTree, esTotal) {
  var ventaTotal = 0, cuotaVentas = 0, proy = 0, activas = 0, cuotaActivas = 0;
  filas.forEach(function (r) {
    ventaTotal   += _rsmNum_(r[ix.VENTA_TOTAL])   || 0;
    cuotaVentas  += _rsmNum_(r[ix.CUOTA_VENTAS])  || 0;
    proy         += _rsmNum_(r[ix.PROY_CIERRE])   || 0;
    cuotaActivas += _rsmNum_(r[ix.CUOTA_ACTIVAS]) || 0;
    if (_rsmEsActiva_(r, ix, activaTree)) activas++;
  });
  var ventasProyPct = cuotaVentas > 0 ? proy / cuotaVentas : null;
  var activasPct    = cuotaActivas > 0 ? activas / cuotaActivas : null;

  var fpdReal  = _rsmFpdReal_(filas, ix);
  var cuotaFpd = _rsmCuotaFpd_(filas, ix, esTotal);
  var fpdCumpl = (fpdReal != null && fpdReal > 0 && cuotaFpd != null) ? cuotaFpd / fpdReal : null;

  var vc = _rsmVc_(filas, ix);
  var vcCumpl = (vc.ratio != null) ? vc.ratio / RESUMEN_CFG.VC_META : null;

  return {
    ventas:  { valor: Math.round(ventaTotal), cuota: Math.round(cuotaVentas), proy: Math.round(proy),
               proyPct: ventasProyPct, estado: _rsmEstadoCump_(ventasProyPct), barra: _rsmCap01_(ventasProyPct), tick: 1.0 },
    activas: { valor: activas, cuota: Math.round(cuotaActivas), pct: activasPct,
               estado: _rsmEstadoCump_(activasPct), barra: _rsmCap01_(activasPct), tick: 1.0 },
    fpd:     { valor: fpdReal, cuota: cuotaFpd, cumpl: fpdCumpl, estado: _rsmEstadoCump_(fpdCumpl),
               barra: _rsmCap01_(fpdCumpl), tick: 1.0 },
    vc:      { disponible: true, ratio: vc.ratio, num: vc.num, den: vc.den, meta: RESUMEN_CFG.VC_META, cumpl: vcCumpl,
               estado: _rsmEstadoCump_(vcCumpl), barra: _rsmCap01_(vcCumpl), tick: 1.0 }
  };
}

/* ================= Reglas aisladas ================= */
// "Activa" por fórmula sembrada (fallback VENTA_TOTAL>0).
function _rsmEsActiva_(r, ix, activaTree) {
  if (!activaTree) return (_rsmNum_(r[ix.VENTA_TOTAL]) || 0) > 0;
  var v = evalFormulaNode_(activaTree, function(name){ var i = idx_(ix, name); return i > -1 ? r[i] : ''; });
  return v === 1;
}

// FPD15 real ponderado: sum(FFPD15_LAST4W)/sum(VFPD15_LAST4W).
function _rsmFpdReal_(filas, ix) {
  var F = 0, V = 0;
  filas.forEach(function (r) { var f = _rsmNum_(r[ix.FFPD15_LAST4W]), v = _rsmNum_(r[ix.VFPD15_LAST4W]); if (f != null) F += f; if (v != null) V += v; });
  return V > 0 ? F / V : null;
}

// Cuota FPD agregada: promedio simple de CUOTA_FPD (nivel manager/ejecutivo);
// en la vista total del maestro usa CUOTA_FPD_GENERAL (no promedia promedios).
function _rsmCuotaFpd_(filas, ix, esTotal) {
  var col = esTotal ? ix.CUOTA_FPD_GENERAL : ix.CUOTA_FPD;
  var s = 0, n = 0;
  filas.forEach(function (r) { var c = _rsmNum_(r[col]); if (c != null) { s += c; n++; } });
  return n > 0 ? s / n : null;
}

// Venta Conjunta: ratio de activación sum(activada)/sum(con_cupo).
function _rsmVc_(filas, ix) {
  var a = 0, c = 0;
  filas.forEach(function (r) { var x = _rsmNum_(r[ix.ACTIVADA]), y = _rsmNum_(r[ix.CON_CUPO]); a += (x || 0); c += (y || 0); });
  return { ratio: c > 0 ? a / c : null, num: Math.round(a), den: Math.round(c) };
}

/* ================= Tiendas críticas (usa el motor de semáforo encadenado) ================= */
function _rsmCriticas_(filas, ix, rol, calcData) {
  var cF7 = findSemCalcByOrigen_(calcData,'FPD7'), cF15 = findSemCalcByOrigen_(calcData,'FPD15'), cDif = findSemCalcByOrigen_(calcData,'DIF_REL');
  var items = [];
  filas.forEach(function (r) {
    var dif = _rsmNum_(r[ix.DIF_REL]);
    var vF7  = resolveOrigenNum_('FPD7',  r, ix, calcData);
    var vF15 = resolveOrigenNum_('FPD15', r, ix, calcData);
    var sF7  = cF7  ? _rsmMapSem_(semaforoRender_(vF7,  cF7.definicion,  cF7.tipo,  false).sem)  : 'nd';
    var sF15 = cF15 ? _rsmMapSem_(semaforoRender_(vF15, cF15.definicion, cF15.tipo, false).sem) : 'nd';
    var sDif = cDif ? _rsmMapSem_(semaforoRender_(dif, cDif.definicion, cDif.tipo, false).sem) : (dif == null ? 'nd' : (dif < 0 ? 'crit' : 'ok'));
    var rojos = [sF7, sF15, sDif].filter(function (e){ return e === 'crit'; }).length;
    var ambar = [sF7, sF15, sDif].filter(function (e){ return e === 'warn'; }).length;
    if (rojos === 0 && ambar === 0) return;
    items.push({ id: String(r[ix.MERCHANTID] || ''), nombre: String(r[ix.MERCHANTNAME] || ''),
      ejecutivo: rol === 'ejecutivo' ? '' : String(r[ix.EJECUTIVO] || ''), zohoId: String(r[ix.ZOHO_ACCOUNT_ID] || ''),
      dif: dif, difEstado: sDif, fpd7Estado: sF7, fpd15Estado: sF15, _score: rojos * 10 + ambar });
  });
  items.sort(function (a, b){ return b._score - a._score; });
  return items.slice(0, RESUMEN_CFG.MAX_CRITICAS).map(function (o){ delete o._score; return o; });
}

/* ================= Frescura (hoja Meta, por etiqueta) ================= */
function getMetaResumen_() {
  var sh = SpreadsheetApp.openById(RESUMEN_CFG.SHEET_ID).getSheetByName(RESUMEN_CFG.TAB_META);
  var raw = {};
  if (sh && sh.getLastRow() >= 1) {
    var vals = sh.getRange(1, 1, sh.getLastRow(), 2).getValues();   // sin shift: la fila 1 ya es dato
    vals.forEach(function (r) { var k = String(r[0] || '').trim(); if (k) raw[k] = r[1]; });
  }
  var rep = _rsmFecha_(raw['reporte_actualizado']);
  var ev  = _rsmFecha_(raw['ultima_evaluacion']);
  var stale = false;
  if (rep.date) stale = ((Date.now() - rep.date.getTime()) / 36e5) > RESUMEN_CFG.UMBRAL_FRESCURA_H;
  return { reporteCorto: rep.corto, reporteLargo: rep.largo, evalCorto: ev.corto, evalLargo: ev.largo, stale: stale };
}

/* ================= Helpers (prefijo _rsm) =================
 * _rsmLeerTab_ / _rsmIdx_ quedan definidos por compatibilidad aunque la carga
 * unificada ya no los use (el Resumen ahora recibe el array de getBootstrap). */
function _rsmLeerTab_(nombre) {
  var sh = SpreadsheetApp.openById(RESUMEN_CFG.SHEET_ID).getSheetByName(nombre);
  if (!sh) throw new Error('No existe la pestaña "' + nombre + '"');
  var vals = sh.getDataRange().getValues();
  var hdr = vals.shift().map(String);
  return { hdr: hdr, filas: vals };
}
function _rsmIdx_(hdr) {
  var m = {}; hdr.forEach(function (h, i) { m[String(h).trim().toUpperCase()] = i; });
  return applyAliases_(m);
}
function _rsmNum_(v) {
  if (v === '' || v === null || v === undefined) return null;
  var n = Number(String(v).replace(/,/g, '').trim());
  return isFinite(n) ? n : null;
}
function _rsmLow_(v) { return String(v || '').toLowerCase().trim(); }
function _rsmCap01_(x) { return x == null ? 0 : Math.max(0, Math.min(1, x)); }
function _rsmMapSem_(sem) { return sem === 'bad' ? 'crit' : sem === 'warn' ? 'warn' : sem === 'ok' ? 'ok' : 'nd'; }
function _rsmEstadoCump_(pct) {
  if (pct == null) return 'nd';
  if (pct >= RESUMEN_CFG.CUMP_OK) return 'ok';
  if (pct >= RESUMEN_CFG.CUMP_ALERTA) return 'warn';
  return 'crit';
}
function _rsmFecha_(v) {
  if (v === null || v === undefined || v === '') return { date: null, corto: '', largo: '' };
  var dt = null;
  if (v instanceof Date) {
    dt = v;
  } else {
    // Puede venir como texto ISO (tras pasar por la caché JSON) o como fecha en texto.
    var s = String(v).trim();
    var parsed = new Date(s);
    if (!isNaN(parsed.getTime())) dt = parsed;
  }
  if (dt) {
    return { date: dt,
      corto: Utilities.formatDate(dt, RESUMEN_CFG.TZ, 'dd/MM HH:mm'),
      largo: Utilities.formatDate(dt, RESUMEN_CFG.TZ, 'dd/MM/yyyy HH:mm') };
  }
  var t = String(v || '').trim();
  return { date: null, corto: t, largo: t };
}

/* ================= Sesión/rol (conectado a la auth) ================= */
function resumenSesion_() {
  var email = activeEmail_();

  if (rol === 'usuario') rol = 'ejecutivo';  // el Resumen usa 'ejecutivo'

  return {

    var mid = iMid > -1 ? String(fila[iMid] == null ? '' : fila[iMid]).trim().replace(/\.0+$/, '') : '';
    if (!mid || CLERKS_VISTOS[mid]) return;
    var recs = (await leer(FORMS.Clerks.report, '(SNAPSHOT == "' + DIAG.snapshot + '" && MERCHANT_ID == "' + mid + '")')).data;
    CLERKS_VISTOS[mid] = true;
    var hc = C.LIBRO.hojas.Clerks, flds = CAMPOS.Clerks;
    recs.forEach(function(rec){ hc.filas.push(flds.map(function(f){ return C.tipar(rec[f.link_name]); })); });
  }

  /* ---------- guardar en Creator las hojas que el servidor modificó ---------- */
  function copiaEscribibles(){
    var c = {};
    Object.keys(FORMS).forEach(function(n){
      var h = C.LIBRO.hojas[n];
      if (FORMS[n].escribible && h) c[n] = h.filas.map(function(f){ return f.slice(); });
    });
    return c;
  }
  async function persistir(nombre){
    var h = C.LIBRO.hojas[nombre], def = FORMS[nombre], flds = CAMPOS[nombre];
    var porNombre = {};
    flds.forEach(function(f){ porNombre[norm(f.display_name)] = f.link_name; });
    var head = (h.filas[0] || []).map(function(x){ return String(x == null ? '' : x).trim(); });
    var regs = h.filas.slice(1).filter(function(f){ return !C.filaVacia(f); }).map(function(f){
      var o = {};
      head.forEach(function(hn, i){ var ln = porNombre[norm(hn)]; if (ln) o[ln] = C.aTexto(f[i]); });
      return o;
    });
    // 1) alta de la versión nueva
    var nuevos = [];
    for (var i = 0; i < regs.length; i += 200){
      var lote = regs.slice(i, i + 200);
      DIAG.llamadas++;
      var r;
      try { r = await sdk().DATA.addRecords({ form_name: def.form, payload: { data: lote } }); }
      catch(e){ throw errorLegible(e, 'guardando ' + def.form); }
      var lista = (r && r.result) ? r.result : [r];
      lista.forEach(function(x){
        if (!x || Number(x.code) !== 3000) throw errorLegible(x, 'guardando ' + def.form);
        if (x.data && x.data.ID) nuevos.push(x.data.ID);
      });
    }
    // 2) baja de la versión anterior (solo si el alta salió completa)
    var viejos = IDS[nombre] || [];
    for (var j = 0; j < viejos.length; j += 50){
      var crit = viejos.slice(j, j + 50).map(function(id){ return 'ID == ' + id; }).join(' || ');
      DIAG.llamadas++;
      try { await sdk().DATA.deleteRecords({ report_name: def.report, criteria: crit }); }
      catch(e){ if (codigoDe(e) !== 9220) throw errorLegible(e, 'limpiando ' + def.form); }
    }
    IDS[nombre] = nuevos;
    h.sucia = false;
  }

  /* ---------- google.script.run ---------- */
  var COLA = Promise.resolve();
  function invocar(nombre, args, ok, fallo, usuario){
    COLA = COLA.then(async function(){
      var copia = null;
      try {
        await LISTO;
        var fn = VC_SERVER[nombre];
        if (typeof fn !== 'function') throw new Error('Función no disponible en el widget: ' + nombre);
        if (NECESITAN_TIENDAS[nombre] || (nombre === 'getBootstrap' && !LIVIANOS[MODULO])) await asegurarTiendas();
        if (nombre === 'getStoreDetail') await asegurarClerks(args[0]);
        copia = copiaEscribibles();
        var res = fn.apply(null, args);
        var sucias = Object.keys(FORMS).filter(function(n){ return FORMS[n].escribible && C.LIBRO.hojas[n] && C.LIBRO.hojas[n].sucia; });
        for (var i = 0; i < sucias.length; i++) await persistir(sucias[i]);
        var out = (res === undefined) ? null : JSON.parse(JSON.stringify(res));
        setTimeout(function(){ if (ok) ok(out, usuario); }, 0);
      } catch(e){
        if (copia){                                   // deja la memoria igual a lo que quedó guardado
          Object.keys(copia).forEach(function(n){ var h = C.LIBRO.hojas[n]; if (h){ h.filas = copia[n]; h.sucia = false; } });
          C.limpiarCache();
        }
        var err = (e instanceof Error) ? e : errorLegible(e, nombre);
        console.error('[VC] ' + nombre + ':', err);
        setTimeout(function(){ if (fallo) fallo(err, usuario); }, 0);
      }
    });
  }
  function runner(ok, fallo, usuario){
    return new Proxy({}, {
      get: function(_, prop){
        if (prop === 'withSuccessHandler') return function(fn){ return runner(fn, fallo, usuario); };
        if (prop === 'withFailureHandler') return function(fn){ return runner(ok, fn, usuario); };
        if (prop === 'withUserObject') return function(o){ return runner(ok, fallo, o); };
        if (typeof prop !== 'string') return undefined;
        return function(){ invocar(prop, Array.prototype.slice.call(arguments), ok, fallo, usuario); };
      }
    });
  }
  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, 'run', { get: function(){ return runner(null, null, undefined); } });
  window.google.script.host = { close: function(){}, editor: null };
})();

</script>
