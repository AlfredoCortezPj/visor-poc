<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
  var PAGE = 60;
  var STATE = { all: [], filtered: [], shown: 0, cfg: { TITLE_COL:'', CARD_COLS:[] }, viewAs: null, role: 'usuario',
    filters: { sinVisita:false, fpd7:false, fpd15:false, dif:false, habilitado:'', tipo:'' },
    habValues: [], tipoValues: [] };
  var ZLINK = {
    ACCOUNT_BASE:       'https://crm.zoho.com/crm/org652147581/tab/Accounts/',
    VISITA_CREATE_BASE: 'https://crm.zoho.com/crm/org652147581/tab/CustomModule120/create?redirect=false&layoutId=',
    LAYOUT_USUARIO:     '2743037000716292537',   // ejecutivo crea la visita
    LAYOUT_SUPERIOR:    '2743037000726677194',    // supervisor / admin / maestro
    VISITA_VIEW:        'https://crm.zoho.com/crm/org652147581/tab/CustomModule120/'
  };
  // El layout depende del ROL REAL de quien crea (no del rol "visto"): en "Ver como",
  // quien crea el registro en Zoho es el supervisor/maestro con su propia sesion.
  function visitaCreateUrl(){
    // En "Ver como" usa el rol SIMULADO (viewingRole); fuera de eso, tu rol real.
    var st = window.STATE || {};
    var r = String((st.viewAs ? st.viewingRole : st.role) || 'usuario').toLowerCase();
    return ZLINK.VISITA_CREATE_BASE + (r === 'usuario' ? ZLINK.LAYOUT_USUARIO : ZLINK.LAYOUT_SUPERIOR);
  }
  var ADMIN = null;
  var LAST_DETAIL = null;   // { key, res } — solo la última tienda abierta
  var PREV_VIEW = 'tiendas';   // módulo desde el que se abrió Usuarios/Campos
  function volverModulo(){
    if (!camposGuard()) return;
    if (PREV_VIEW === 'resumen') showResumen();
    else if (PREV_VIEW === 'visitas') showVisitas();
    else showStores();
  }  
    function currentView_(){
    var rv = document.getElementById('rsmView');
    if (rv && rv.style.display !== 'none') return 'resumen';
    var vv = document.getElementById('visitasView');
    if (vv && vv.style.display !== 'none') return 'visitas';
    return 'tiendas';
  }
  var LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbgAAABQCAYAAABrqmDoAABP20lEQVR42u19eZxcVZX/99x733tV1Z0EEAKOgus4TodxAQYQklQ34riNjs74ygUERzBhCxFDFnB5/RyFrGxZSKI442055191YY43ZVjR2FlG8i7VNMZ7XHRysbAy9onc9RxlIisWXNldm2Nldm2N9Ym2Z8oPP7lIisWXbllNS7Uy1XBEEQVBBFEURTEEURFEIQRElEEEURFHIRERBFERQxCEIQRAEQRAEQRAERBHFhHZlVy9UBEFJlERBBHFHFH9tOBcHNOWCPPWKZOhTMkOhQEAAAKSKZOhTMkOhQGAAgADOJlUL4jFdOwFAAAAAElFTkSuQmCC';
  var LOADING_HTML = '<div class="loading-logo"><img src="' + LOGO + '" alt="PayJoy"><span>Cargando&hellip;</span></div>';
  var ICON_EYE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var ICON_X   = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>';
  var ICON_EDIT = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

  function hideBoot(){ var g=document.getElementById('bootGate'); if(g) g.style.display='none'; }
  (function(){ var b=document.getElementById('bootLogo'); if(b) b.src = LOGO; })();  

  /* ---------- menu del correo ---------- */
  function buildMenu(){
    var m = document.getElementById('userMenu');
    if (STATE.role === 'maestro'){
      m.innerHTML = '<div class="mtitle">Administraci&oacute;n</div>' +
        '<button onclick="menuGo(\'usuarios\')">Usuarios</button>' +
        '<button onclick="menuGo(\'campos\')">Campos</button>';
    } else if (STATE.role === 'supervisor'){
      m.innerHTML = '<div class="mtitle">Administraci&oacute;n</div><button onclick="menuGo(\'usuarios\')">Mis ejecutivos</button>';
    } else {
      m.innerHTML = '<div class="mempty">Sin m&oacute;dulos disponibles</div>';
    }
  }
  function toggleMenu(ev){
    ev.stopPropagation();
    buildMenu();
    document.getElementById('userMenu').classList.toggle('open');
  }
  function menuGo(key){
    document.getElementById('userMenu').classList.remove('open');
    if (!camposGuard()) return;
    PREV_VIEW = currentView_();            // <-- recuerda dónde estabas
    if (key === 'usuarios') showUsers();
    else if (key === 'campos') showCampos();
  }

  /* ---------- barra lateral de módulos ---------- */
  function openNav(ev){
    if (ev) ev.stopPropagation();
    document.getElementById('navOverlay').classList.add('open');
    document.getElementById('navPanel').classList.add('open');
    document.body.classList.add('no-scroll');
  }
  function closeNav(){
    document.getElementById('navOverlay').classList.remove('open');
    document.getElementById('navPanel').classList.remove('open');
    document.body.classList.remove('no-scroll');
  }
  function navGo(mod){
    if (!camposGuard()) return;      // no salir de Campos con cambios sin guardar
    closeNav();
    if (mod === 'tiendas') showStores();
    else if (mod === 'visitas') showVisitas();
  }
  function updateNavActive(mod){
    var t = document.getElementById('navTiendas'), v = document.getElementById('navVisitas');
    if (t) t.classList.toggle('active', mod === 'tiendas');
    if (v) v.classList.toggle('active', mod === 'visitas');
  }

  /* Aviso al salir del gestor de Campos con cambios sin guardar. */
  function camposGuard(){
    var cv = document.getElementById('camposView');
    if (cv && cv.style.display !== 'none' && CAMPOS_STATE.length &&
        JSON.stringify(camposProjection()) !== CAMPOS_SNAP){
      return confirm('Tienes cambios sin guardar en Campos. \u00bfSalir y descartarlos?');
    }
    return true;
  }
  function volverTiendas(){ if (camposGuard()) showStores(); }

  /* ---------- módulo Visitas (agenda semanal) ---------- */
  function showVisitas(){
    document.getElementById('storeView').style.display = 'none';
    document.getElementById('usersView').style.display = 'none';
    document.getElementById('camposView').style.display = 'none';
    var vv = document.getElementById('visitasView');
    vv.style.display = '';
    vv.innerHTML = LOADING_HTML;
    updateNavActive('visitas');
    google.script.run.withSuccessHandler(renderVisitas)
      .withFailureHandler(function(err){ vv.innerHTML = '<div class="empty">' + (err && err.message ? err.message : 'Error') + '</div>'; })
      .getVisitas(STATE.viewAs || null);
  }

  function renderVisitas(d){
    var verEje = (d.role === 'supervisor' || d.role === 'maestro' || d.role === 'admin');
    var total = 0;
    var cols = (d.days || []).map(function(day){
      total += day.visitas.length;
      var cuerpo = day.visitas.length
        ? day.visitas.map(function(v){ return visitaCard(v, verEje); }).join('')
        : '<div class="vempty">Sin visitas</div>';
      var count = day.visitas.length ? '<span class="daycount">' + day.visitas.length + '</span>' : '';
      return '<div class="day' + (day.esHoy ? ' today' : '') + '">' +
        '<div class="dayhead">' + esc(day.label) + count + '</div>' +
        '<div class="daybody">' + cuerpo + '</div></div>';
    }).join('');
    document.getElementById('visitasView').innerHTML =
      '<div class="uhead"><h2>Visitas de la semana</h2>' +
        '<span class="ulabel" style="margin-left:auto">' + total + ' programada' + (total === 1 ? '' : 's') + '</span></div>' +
      '<div class="week">' + cols + '</div>';
  }

  function visitaCard(v, verEje){
    var nombre = v.merchant || v.merchantId || '\u2014';
    var estadoPill = v.estado ? '<span class="pill pill-neu">' + esc(v.estado) + '</span>' : '';
    var eje = (verEje && v.ejecutivo) ? '<div class="veje">' + esc(v.ejecutivo) + '</div>' : '';
    var clickable = !!v.id;
    var attrs = clickable ? ' onclick="abrirVisita(\'' + escJs(v.id) + '\')"' : '';
    return '<div class="vcard' + (clickable ? '' : ' vcard-off') + '"' + attrs + '>' +
      '<div class="vname">' + esc(nombre) + '</div>' +
      (v.tipo ? '<div class="vmeta">' + esc(v.tipo) + '</div>' : '') +
      (estadoPill ? '<div class="vpills">' + estadoPill + '</div>' : '') +
      eje +
    '</div>';
  }
  function abrirVisita(id){ if (id) window.open(ZLINK.VISITA_VIEW + encodeURIComponent(id), '_blank', 'noopener'); }
  document.addEventListener('click', function(){
    document.getElementById('userMenu').classList.remove('open');
    var am = document.getElementById('actMenu'); if (am) am.classList.remove('open');
  });

  /* ---------- carga de tiendas ---------- */
  // loadData ahora delega en la carga unificada (una sola lectura del servidor).
  // Aterriza en Tiendas: asi "Ver como" (verComo) y "Salir de esta vista" siguen mostrando tiendas.
  function loadData(viewAs){ bootstrap(viewAs || null, 'tiendas'); }
  // (La carga inicial ya no se dispara aqui; bootstrap(null,'resumen') se llama al final del ultimo script.)

  function onData(res){
    console.log('onData ->', JSON.stringify(res && {role:res.role, email:res.email}));
    if (typeof applyGate === 'function' && applyGate(res.role)) return;
        STATE.all = res.rows; STATE.cfg = res.config; STATE.viewAs = res.viewingAs || null; STATE.role = res.role; STATE.viewingRole = res.viewingRole || res.role;
    document.getElementById('userChip').innerHTML = (res.email || 'Sin sesi&oacute;n') + ' <span class="caret">&#9660;</span>';
    document.getElementById('roleBadge').textContent = res.role || 'usuario';

    var b = document.getElementById('viewBanner');
    if (res.viewingAs){
      b.style.display = 'flex';
      document.getElementById('viewBannerText').textContent = 'Viendo como ' + res.viewingAs + ' (rol ' + res.viewingRole + ')';
    } else { b.style.display = 'none'; }

    // Precarga la lista de usuarios en segundo plano (solo maestro) para abrir el modulo al instante
    if (res.role === 'maestro' && !ADMIN){
      google.script.run.withSuccessHandler(function(d){ ADMIN = d; }).getAdminData();
    }

    // Filtros: reinicia y arma la barra con los valores reales de la data.
    STATE.filters = { sinVisita:false, fpd7:false, fpd15:false, dif:false, habilitado:'', tipo:'' };
    computeFilterValues();
    renderFilterBar();

    applySearch();
    hideBoot();  
  }

  function computeFilterValues(){
    var habs = {}, tipos = {};
    STATE.all.forEach(function(r){
      if (r.habilitado) habs[r.habilitado] = true;
      if (r.tipo) tipos[r.tipo] = true;
    });
    STATE.habValues = Object.keys(habs).sort();
    STATE.tipoValues = Object.keys(tipos).sort();
  }

  /* ---------- barra de filtros (etiquetas especiales, en el cliente) ---------- */
  function toggleFilters(){
    var p = document.getElementById('filterPanel');
    p.style.display = (!p.style.display || p.style.display === 'none') ? 'block' : 'none';
  }
  function renderFilterBar(){
    var f = STATE.filters;
    function chip(key, label){
      return '<button class="fchip' + (f[key] ? ' on' : '') + '" onclick="toggleFilterChip(\'' + key + '\',this)">' + label + '</button>';
    }
    function sel(key, label, vals){
      var opts = '<option value="">Todos</option>' + vals.map(function(v){
        return '<option value="' + esc(v) + '"' + (f[key] === v ? ' selected' : '') + '>' + esc(v) + '</option>';
      }).join('');
      return '<label class="fsel">' + label + ' <select onchange="setFilter(\'' + key + '\',this.value)">' + opts + '</select></label>';
    }
    document.getElementById('filterPanel').innerHTML =
      '<div class="fchips">' +
        chip('sinVisita','Sin visita') + chip('fpd7','FPD7 rojo') + chip('fpd15','FPD15 rojo') + chip('dif','Dif. mensual rojo') +
      '</div>' +
      '<div class="fsels">' + sel('habilitado','Habilitado', STATE.habValues) + sel('tipo','Tipo de tienda', STATE.tipoValues) + '</div>' +
      '<div class="fclear"><button class="linkbtn" onclick="clearFilters()">Limpiar filtros</button></div>';
    updateFilterCount();
  }
  function toggleFilterChip(key, btn){ STATE.filters[key] = !STATE.filters[key]; btn.classList.toggle('on'); applySearch(); updateFilterCount(); }
  function setFilter(key, val){ STATE.filters[key] = val; applySearch(); updateFilterCount(); }
  function clearFilters(){
    STATE.filters = { sinVisita:false, fpd7:false, fpd15:false, dif:false, habilitado:'', tipo:'' };
    renderFilterBar(); applySearch();
  }
  function updateFilterCount(){
    var f = STATE.filters, n = 0;
    ['sinVisita','fpd7','fpd15','dif'].forEach(function(k){ if (f[k]) n++; });
    if (f.habilitado) n++; if (f.tipo) n++;
    var btn = document.getElementById('filterBtn');
    if (btn) btn.textContent = n ? ('Filtros (' + n + ')') : 'Filtros';
  }

  function onError(err){
    document.getElementById('grid').innerHTML =
      '<div class="empty">No se pudo cargar la data.<br>' + (err && err.message ? err.message : '') + '</div>';
  }

  function val(row, key){
    var v = row[key];
    return (v === null || v === undefined || v === '') ? '\u2014' : v;
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escJs(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  /* ---------- render con paginacion + filtros ---------- */
  function applySearch(){
    var q = document.getElementById('search').value.trim().toLowerCase();
    var f = STATE.filters;
    STATE.filtered = STATE.all.filter(function(r){
      // filtros de etiqueta especial (combinan con TODOS / AND)
      if (f.sinVisita && !r.sinVisita) return false;
      if (f.fpd7 && !(r.fpd7 && r.fpd7.sem === 'bad')) return false;
      if (f.fpd15 && !(r.fpd15 && r.fpd15.sem === 'bad')) return false;
      if (f.dif && !(r.dif && r.dif.sem === 'bad')) return false;
      if (f.habilitado && r.habilitado !== f.habilitado) return false;
      if (f.tipo && (r.tipo || '') !== f.tipo) return false;
      // búsqueda de texto
      if (q){
        if (r._s === undefined) r._s = (r.merchant+' '+r.admin+' '+r.owner+' '+r.supervisor+' '+r.procedencia+' '+r.tipo+' '+r.habilitado).toLowerCase();
        if (r._s.indexOf(q) < 0) return false;
      }
      return true;
    });
    document.getElementById('grid').innerHTML = '';
    STATE.shown = 0;
    if (!STATE.filtered.length){ document.getElementById('grid').innerHTML = '<div class="empty">No hay tiendas para mostrar.</div>'; return; }
    renderMore();
  }

  function renderMore(){
    if (STATE.shown >= STATE.filtered.length) return;
    var list = STATE.filtered;
    var end = Math.min(STATE.shown + PAGE, list.length);
    var html = '';
    for (var i = STATE.shown; i < end; i++){
      var r = list[i];
      var borde = r.borde ? 'border:2px solid #E24B4A;' : '';
      var badge = r.sinVisita ? '<div class="badge-visita">Sin visita</div>' : '';
      var habPill = '<span class="pill ' + (r.habilitado === 'HABILITADO' ? 'pill-ok' : 'pill-bad') + '">' + esc(cap(r.habilitado)) + '</span>';
      var tipoPill = r.tipo ? '<span class="pill ' + (r.churn ? 'pill-bad' : 'pill-neu') + '">' + esc(cap(r.tipo)) + '</span>' : '';
      html += '<div class="card" style="position:relative;' + borde + '" onclick="openPanel(' + r._row + ')">' +
                badge +
                '<div class="c-title">' + esc(r.merchant) + '</div>' +
                '<div class="c-sub" style="margin-bottom:8px">' + esc(r.admin) + '</div>' +
                '<div class="c-pills" style="margin:0 0 10px">' + habPill + tipoPill + '</div>' +
                '<div class="c-sem">' + ventaBlock('Ventas', r.ventaMes) + semBlock('Dif. mensual', r.dif) + semBlock('FPD7', r.fpd7) + semBlock('FPD15', r.fpd15) + '</div>' +
                '<div class="c-foot"><div>' + esc(r.procedencia || '\u2014') + '</div>' +
                  '<div>' + esc(r.owner || '\u2014') + '</div>' +
                  '<div><span class="mut">sup.</span> ' + esc(r.supervisor || '\u2014') + '</div></div>' +
              '</div>';
    }
    document.getElementById('grid').insertAdjacentHTML('beforeend', html);
    STATE.shown = end;
  }
  var SEMC = { ok:'#639922', warn:'#EF9F27', bad:'#E24B4A', na:'#B4B2A9' };
  function semBlock(label, m){
    m = m || { sem:'na', txt:'\u2014' };
    return '<div class="sem"><div class="sem-l">' + label + '</div><div class="sem-v">' + dot(m.sem) + esc(m.txt) + '</div></div>';
  }
  function ventaBlock(label, txt){
    return '<div class="sem"><div class="sem-l">' + label + '</div><div class="sem-v">' + esc(txt || '\u2014') + '</div></div>';
  }
  function dot(sem){ return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + (SEMC[sem] || SEMC.na) + ';margin-right:5px"></span>'; }
  function cap(s){ s = String(s == null ? '' : s).trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : ''; }

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting) renderMore(); });
  }, { rootMargin: '400px' });
  io.observe(document.getElementById('sentinel'));

  /* ---------- detalle: resumen instantaneo + detalle completo ---------- */
  function openPanel(rowNumber){
    var key = (STATE.viewAs || '') + '|' + rowNumber;
    document.getElementById('overlay').classList.add('open');
    document.getElementById('panel').classList.add('open');
    document.body.classList.add('no-scroll');

    if (LAST_DETAIL && LAST_DETAIL.key === key) { renderDetail(LAST_DETAIL.res); return; }  // misma que la última

    document.getElementById('panelTitle').textContent = 'Detalle';
    document.getElementById('panelBody').innerHTML =
      '<div class="loading-logo" style="min-height:40vh"><img src="' + LOGO + '" alt="PayJoy"><span>Cargando\u2026</span></div>';

    google.script.run.withSuccessHandler(function(res){
      LAST_DETAIL = { key: key, res: res };
      renderDetail(res);
    }).withFailureHandler(function(err){

   // Sección de vendedores (clerks) al final del detalle. Ordenados desde Hex.
  function clerksHtml(list){
    list = list || [];
    var head = '<div class="clerk-head">Vendedores <span style="color:#a7aea7">(' + list.length + ')</span></div>';
    if (!list.length){
      return head + '<div class="clerk-empty">Sin vendedores registrados</div>';
    }
    var rows = list.map(function(c){
      var inact = (c.activo === false);
      var tag = inact ? '<span class="clerk-tag">inactivo</span>' : '';
      var sub = c.movido ? '<div class="clerk-sub">ahora en ' + esc(c.movido) + '</div>' : '';
      return '<div class="clerk-row' + (inact ? ' inactivo' : '') + '">' +
          '<div class="clerk-name">' + esc(c.nombre) + tag + sub + '</div>' +
          '<div class="clerk-metrics">' +
            '<div class="clerk-und">' + esc(String(c.und)) + ' <span class="clerk-u">und</span></div>' +
            '<div class="clerk-mora">' + dot(c.sem) + esc(c.mora) + '</div>' +
          '</div>' +
        '</div>';
    }).join('');
    return head + rows;

  /* ---------- gestor de campos (CONFIG_CAMPOS + calculados) ---------- */
  var CAMPOS_FORMATOS = ['TEXTO','ENTERO','DECIMAL','PORCENTAJE','FECHA'];
  var CAMPOS_STATE = [];     // estado vivo de las filas
  var CAMPOS_SNAP  = '[]';   // "foto" para el guardado inteligente
  var CAMPOS_QUERY = '';     // texto de búsqueda actual
  var CAMPOS_SORT  = null;   // instancia de Sortable
  var CAMPOS_COLS = [], CAMPOS_RECETAS = [], CAMPOS_TIPOS = ['semaforo','semaforo_inv','concatenado'], CAMPOS_UNIDADES = ['porcentaje','numero'];
  var CALC_EDIT = null;      // clave en edición (null = crear)
  var CALC_VALS = {};        // valores actuales del modal (prefill)
  var CALC_CONCAT = [];      // columnas del concatenado, en orden
  function normU(s){ return String(s==null?'':s).trim().toUpperCase(); }

  function showCampos(){
    if (STATE.role !== 'maestro') return;
    document.getElementById('storeView').style.display = 'none';
    document.getElementById('usersView').style.display = 'none';
    var vvc = document.getElementById('visitasView'); if (vvc) vvc.style.display = 'none';
    var cv = document.getElementById('camposView');
    cv.style.display = '';
    cv.innerHTML = LOADING_HTML;
    google.script.run.withSuccessHandler(renderCamposManager)
      .withFailureHandler(function(err){ cv.innerHTML = '<div class="empty">' + (err && err.message ? err.message : 'Error') + '</div>'; })
      .getCamposManager();
  }

  function camposProjection(){
    return CAMPOS_STATE.map(function(it){
      return { columna: it.columna, etiqueta: it.etiqueta, enDetalle: !!it.enDetalle, formato: it.formato, protegida: !!it.protegida };
    });
  }
  function refreshSaveBtn(){
    var btn = document.getElementById('saveCamposBtn');
    if (!btn) return;
    btn.disabled = (JSON.stringify(camposProjection()) === CAMPOS_SNAP);
  }

  function renderCamposManager(d){
    CAMPOS_FORMATOS = d.formatos || CAMPOS_FORMATOS;
    CAMPOS_COLS     = d.columnasReales || [];
    CAMPOS_RECETAS  = d.recetas || [];
    CAMPOS_TIPOS    = d.tipos || ['semaforo','semaforo_inv','concatenado'];
    CAMPOS_UNIDADES = d.unidades || ['porcentaje','numero'];
    CAMPOS_QUERY = '';
    var idc = 0;
    CAMPOS_STATE = (d.items || []).map(function(it){
      return { _id: idc++, columna: it.columna, etiqueta: it.etiqueta || '', enDetalle: !!it.enDetalle,
               formato: it.formato || 'TEXTO', protegida: !!it.protegida, estado: it.estado || 'ok',
               alerta: it.alerta || '', sub: it.sub || '' };
    });
    CAMPOS_SNAP = JSON.stringify(camposProjection());
    document.getElementById('camposView').innerHTML =
      '<div class="uhead"><button class="btn sm" style="background:var(--green-d)" onclick="volverModulo()">&larr; Volver</button>' +
        '<h2>Campos del detalle</h2>' +
        '<button class="btn sm grey" style="margin-left:auto" onclick="openCalcModal(null)">+ Nuevo calculado</button>' +
        '<button class="btn sm" id="saveCamposBtn" disabled onclick="saveCampos()">Guardar</button></div>' +
      '<div class="utoolbar"><input class="search" id="camposSearch" placeholder="Buscar campo&hellip;" oninput="camposFilter(this.value)" style="max-width:280px"></div>' +
      '<div class="chint">Arrastra con &#9776; o escribe el n&uacute;mero para reordenar (el n&uacute;mero es la posici&oacute;n global). Con b&uacute;squeda activa el arrastre se desactiva. Guardar se habilita solo si hay cambios.</div>' +
      '<div class="tablewrap"><table class="ctable"><thead><tr>' +
        '<th class="c-h"></th><th class="c-n">#</th><th>Columna</th><th>Etiqueta</th><th>Formato</th>' +
        '<th class="c-c">Ver</th><th class="c-c">Sensible</th><th class="c-c"></th>' +
      '</tr></thead><tbody id="fieldList"></tbody></table></div>';
    renderCamposRows();
  }

  function renderCamposRows(){
    var html = '';
    for (var i = 0; i < CAMPOS_STATE.length; i++){ html += camposRowHtml(CAMPOS_STATE[i], i + 1); }
    document.getElementById('fieldList').innerHTML = html;
    if (CAMPOS_SORT){ CAMPOS_SORT.destroy(); CAMPOS_SORT = null; }
    if (!CAMPOS_QUERY && window.Sortable){
      CAMPOS_SORT = Sortable.create(document.getElementById('fieldList'), {
        handle: '.fdrag', animation: 150, ghostClass: 'fdrag-ghost',
        onChoose: function(evt){ var c = evt.item.children; for (var j=0;j<c.length;j++){ c[j].style.width = c[j].offsetWidth + 'px'; } },
        onEnd: function(evt){
          var c = evt.item.children; for (var j=0;j<c.length;j++){ c[j].style.width = ''; }
          var trs = document.querySelectorAll('#fieldList tr.frow');
          var byId = {}; for (var s=0;s<CAMPOS_STATE.length;s++){ byId[CAMPOS_STATE[s]._id] = CAMPOS_STATE[s]; }
          var next = []; for (var t=0;t<trs.length;t++){ var it = byId[Number(trs[t].getAttribute('data-id'))]; if (it) next.push(it); }
          CAMPOS_STATE = next;
          refreshSaveBtn();
          setTimeout(renderCamposRows, 0); // refresca la numeración fuera del callback
        }
      });
    }
  }

  function camposRowHtml(it, pos){
    var esCalc = (it.estado === 'calculado' || it.estado === 'calculado_nuevo');
    var badges = '';
    if (esCalc) badges += '<span class="fbadge fcalc" title="Campo calculado">&fnof;</span>';
    if (it.estado === 'nueva' || it.estado === 'calculado_nuevo') badges += '<span class="fbadge fnew">nueva</span>';
    if (it.estado === 'huerfana') badges += '<span class="fbadge forph">hu&eacute;rfana' + (it.sub ? ' (' + it.sub + ')' : '') + '</span>';
    var alerta = it.alerta ? '<div class="falert">&#9888; ' + esc(it.alerta) + '</div>' : '';
    var fmtOpts = CAMPOS_FORMATOS.map(function(o){
      return '<option value="' + o + '"' + (normU(o) === normU(it.formato) ? ' selected' : '') + '>' + cap(o) + '</option>';
    }).join('');
    var fmtCell = esCalc
      ? '<span class="fmuted">por receta</span>'
      : '<select class="ffmt" onchange="campoEdit(' + it._id + ',\'formato\',this.value)">' + fmtOpts + '</select>';
    var acciones = '';
    if (esCalc){
      acciones = '<button class="iconbtn" title="Editar receta" onclick="openCalcModal(\'' + escJs(it.columna) + '\')">' + ICON_EDIT + '</button>' +
                 '<button class="iconbtn del" title="Borrar receta" onclick="deleteCalc(\'' + escJs(it.columna) + '\')">' + ICON_X + '</button>';
    } else if (it.estado === 'huerfana'){
      acciones = '<button class="iconbtn del" title="Quitar de la config" onclick="quitarCampo(' + it._id + ')">' + ICON_X + '</button>';
    }
    var q = CAMPOS_QUERY;
    var match = !q || (String(it.columna).toLowerCase().indexOf(q) > -1) || (String(it.etiqueta).toLowerCase().indexOf(q) > -1);
    var hidden = match ? '' : ' style="display:none"';
    return '<tr class="frow' + (it.estado === 'huerfana' ? ' fhuerfana' : '') + '" data-id="' + it._id + '"' + hidden + '>' +
      '<td class="c-h"><span class="fdrag' + (q ? ' off' : '') + '" title="Arrastrar">&#9776;</span></td>' +
      '<td class="c-n"><input type="number" class="fpos" min="1" value="' + pos + '" onchange="campoMover(' + it._id + ',this.value)" title="Posici&oacute;n"></td>' +
      '<td class="fcol">' + esc(it.columna) + badges + alerta + '</td>' +
      '<td><input class="fet" placeholder="' + esc(it.columna) + '" value="' + esc(it.etiqueta) + '" oninput="campoEdit(' + it._id + ',\'etiqueta\',this.value)"></td>' +
      '<td>' + fmtCell + '</td>' +
      '<td class="c-c"><input type="checkbox" class="fdet"' + (it.enDetalle ? ' checked' : '') + ' onchange="campoEdit(' + it._id + ',\'enDetalle\',this.checked)"></td>' +
      '<td class="c-c"><input type="checkbox" class="fprot"' + (it.protegida ? ' checked' : '') + ' onchange="campoEdit(' + it._id + ',\'protegida\',this.checked)"></td>' +
      '<td class="c-c">' + acciones + '</td>' +
    '</tr>';
  }

  function campoIndex(id){ for (var i=0;i<CAMPOS_STATE.length;i++){ if (CAMPOS_STATE[i]._id === id) return i; } return -1; }

  function campoEdit(id, field, value){
    var i = campoIndex(id);
    if (i > -1){ CAMPOS_STATE[i][field] = value; refreshSaveBtn(); }
  }

  function campoMover(id, posStr){
    var target = parseInt(posStr, 10);
    var n = CAMPOS_STATE.length;
    if (isNaN(target)){ renderCamposRows(); return; }
    if (target < 1) target = 1; if (target > n) target = n;
    var from = campoIndex(id);
    if (from < 0){ renderCamposRows(); return; }
    var item = CAMPOS_STATE.splice(from, 1)[0];
    CAMPOS_STATE.splice(target - 1, 0, item);
    renderCamposRows();
    refreshSaveBtn();
  }

  function camposFilter(q){ CAMPOS_QUERY = String(q || '').trim().toLowerCase(); renderCamposRows(); }

  function quitarCampo(id){
    var i = campoIndex(id);
    if (i < 0) return;
    if (!confirm('\u00bfQuitar "' + CAMPOS_STATE[i].columna + '" de la configuraci\u00f3n?')) return;
    CAMPOS_STATE.splice(i, 1);
    renderCamposRows();
    refreshSaveBtn();
  }

  function saveCampos(){
    if (!CAMPOS_STATE.length){ alert('No hay campos para guardar.'); return; }
    var items = [], protOn = [];
    for (var i = 0; i < CAMPOS_STATE.length; i++){
      var it = CAMPOS_STATE[i];
      if (it.protegida && it.enDetalle) protOn.push(it.columna);
      items.push({ columna: it.columna, etiqueta: String(it.etiqueta || '').trim(),
                   enDetalle: !!it.enDetalle, formato: it.formato || 'TEXTO', protegida: !!it.protegida });
    }
    if (protOn.length){
      if (!confirm('Vas a mostrar ' + protOn.length + ' campo(s) sensible(s) en el detalle:\n' + protOn.join(', ') + '\n\n\u00bfContinuar?')) return;
    }
    var btn = document.getElementById('saveCamposBtn');
    if (btn){ btn.disabled = true; btn.textContent = 'Guardando\u2026'; }
    LAST_DETAIL = null; // invalida el detalle cacheado en el cliente
    google.script.run.withSuccessHandler(function(d){
      renderCamposManager(d);
    }).withFailureHandler(function(err){
      var b = document.getElementById('saveCamposBtn'); if (b){ b.disabled = false; b.textContent = 'Guardar'; }
      alert((err && err.message) ? err.message : 'Error al guardar.');
    }).saveCampos(items);
  }

  /* ---------- modal de campo calculado (crear / editar / borrar receta) ---------- */
  function colOptionsCalc(sel){
    return CAMPOS_COLS.map(function(c){
      return '<option value="' + esc(c) + '"' + (normU(c) === normU(sel) ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');
  }
  function tipoLabel(t){
  return t === 'semaforo' ? 'Sem\u00e1foro (alto = peor)'
       : t === 'semaforo_inv' ? 'Sem\u00e1foro invertido (alto = mejor)'
       : t === 'concatenado' ? 'Concatenado'
       : t === 'formula' ? 'C\u00e1lculo / condici\u00f3n (f\u00f3rmula)' : t;
  }
  function origenOptionsCalc(sel){
  var opts = CAMPOS_COLS.slice();
  (CAMPOS_RECETAS||[]).forEach(function(r){ if (r.tipo === 'formula') opts.push(r.clave); });
  return opts.map(function(c){ return '<option value="'+esc(c)+'"'+(normU(c)===normU(sel)?' selected':'')+'>'+esc(c)+'</option>'; }).join('');
  }
  function calcFormulaPreview(){
    var el=document.getElementById('calcFormulaPrev'); if(!el) return;
    var expr=(document.getElementById('calcFormula')||{}).value||'';
    var ids=expr.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[]; var uniq=[];
    ids.forEach(function(x){ if(uniq.indexOf(x)<0) uniq.push(x); });
    el.innerHTML = uniq.length ? uniq.map(function(c){ var ok=CAMPOS_COLS.some(function(k){return normU(k)===normU(c);});
      return '<span class="chip">'+dot(ok?'ok':'bad')+esc(c)+(ok?'':' ?')+'</span>'; }).join('')
      : '<span class="fmuted">Escribe la f\u00f3rmula\u2026</span>';
  }
  function openCalcModal(clave){
    if (JSON.stringify(camposProjection()) !== CAMPOS_SNAP){
      if (!confirm('Tienes cambios de orden/visibilidad sin guardar en el gestor.\nSe perder\u00e1n al abrir el editor (recarga desde el servidor).\n\n\u00bfContinuar de todos modos?')) return;
    }
    CALC_EDIT = clave || null;
    var rec = null;
    if (CALC_EDIT){
      for (var i = 0; i < CAMPOS_RECETAS.length; i++){
        if (normU(CAMPOS_RECETAS[i].clave) === normU(CALC_EDIT)){ rec = CAMPOS_RECETAS[i]; break; }
      }
    }
    var def = (rec && rec.definicion) ? rec.definicion : {};
    CALC_VALS = {
      clave:  rec ? rec.clave : '',
      tipo:   rec ? rec.tipo : 'semaforo',
      origen: rec ? rec.origen : (CAMPOS_COLS[0] || ''),
      unidad: def.unidad || 'porcentaje',
      formula: (rec && rec.definicion) ? (rec.definicion.formula || '') : '',
      c1:     (def.corte1 != null) ? def.corte1 : '',
      c2:     (def.corte2 != null) ? def.corte2 : '',
      sep:    (def.separador != null) ? def.separador : ' - '
    };
    CALC_CONCAT = (def.columnas && def.columnas.length) ? def.columnas.slice() : [ (CAMPOS_COLS[0] || '') ];
    document.getElementById('calcTitle').textContent = CALC_EDIT ? ('Editar: ' + CALC_VALS.clave) : 'Nuevo calculado';
    renderCalcModal();
    document.getElementById('calcOv').classList.add('open');
  }
  function closeCalcModal(){ document.getElementById('calcOv').classList.remove('open'); }

  function renderCalcModal(){
    var tipoOpts = CAMPOS_TIPOS.map(function(t){
      return '<option value="' + t + '"' + (t === CALC_VALS.tipo ? ' selected' : '') + '>' + tipoLabel(t) + '</option>';
    }).join('');
    document.getElementById('calcBody').innerHTML =
      '<div class="mfield"><label>Nombre interno (fijo)</label>' +
        '<input id="calcClave" placeholder="ej. Semaforo FPD7" value="' + esc(CALC_VALS.clave) + '"' + (CALC_EDIT ? ' disabled' : '') + '></div>' +
      '<div class="mfield"><label>Tipo</label><select id="calcTipo" onchange="calcTipoChange()">' + tipoOpts + '</select></div>' +
      '<div id="calcSection"></div>' +
      '<div class="mactions">' +
        '<button class="btn sm grey" onclick="closeCalcModal()">Cancelar</button>' +
        '<button class="btn sm" id="calcSaveBtn" onclick="saveCalcModal()">Guardar receta</button></div>';
    renderCalcSection(CALC_VALS.tipo);
  }
  function calcTipoChange(){ CALC_VALS.tipo = document.getElementById('calcTipo').value; renderCalcSection(CALC_VALS.tipo); }

  function renderCalcSection(tipo){
    var el = document.getElementById('calcSection');
    if (tipo === 'formula'){
      el.innerHTML =
        '<div class="mfield"><label>F\u00f3rmula</label>'
        + '<input id="calcFormula" placeholder="ej. FFPD15_LAST4W / VFPD15_LAST4W   \u00f3   VENTA_TOTAL &gt; 0" value="'+esc(CALC_VALS.formula||'')+'" oninput="calcFormulaPreview()"></div>'
        + '<div class="mfield"><label>Columnas detectadas</label><div id="calcFormulaPrev" class="calcprev"></div></div>'
        + '<div class="chint">Usa columnas, n\u00fameros, + - * / ( ) y comparadores &gt; &gt;= &lt; &lt;= == != (una comparaci\u00f3n devuelve 1/0).</div>';
      calcFormulaPreview(); return;
    }
    if (tipo === 'concatenado'){
      el.innerHTML =
        '<div class="mfield"><label>Separador</label><input id="calcSep" value="' + esc(CALC_VALS.sep) + '"></div>' +
        '<div class="mfield"><label>Columnas a unir (orden = como se muestran)</label>' +
          '<div id="calcConcatList"></div>' +
          '<button class="btn sm grey" style="margin-top:8px" onclick="concatAdd()">+ Agregar columna</button></div>';
      renderConcatList();
    } else {
      var uniOpts = CAMPOS_UNIDADES.map(function(u){
        return '<option value="' + u + '"' + (u === CALC_VALS.unidad ? ' selected' : '') + '>' + (u === 'porcentaje' ? 'Porcentaje (%)' : 'N\u00famero') + '</option>';
      }).join('');
      el.innerHTML =
        '<div class="mfield"><label>Columna origen (real o campo calculado)</label><select id="calcOrigen">' + origenOptionsCalc(CALC_VALS.origen) + '</select></div>' +
        '<div class="mfield"><label>Unidad</label><select id="calcUnidad" onchange="calcPreview()">' + uniOpts + '</select></div>' +
        '<div class="mrow2">' +
          '<div class="mfield"><label>Corte verde &rarr; &aacute;mbar</label><input id="calcC1" type="number" step="any" value="' + esc(CALC_VALS.c1) + '" oninput="calcPreview()"></div>' +
          '<div class="mfield"><label>Corte &aacute;mbar &rarr; rojo</label><input id="calcC2" type="number" step="any" value="' + esc(CALC_VALS.c2) + '" oninput="calcPreview()"></div>' +
        '</div>' +
        '<div class="mfield"><label>Vista previa</label><div id="calcPreview" class="calcprev"></div></div>';
      calcPreview();
    }
  }

  function renderConcatList(){
    document.getElementById('calcConcatList').innerHTML = CALC_CONCAT.map(function(c, i){
      return '<div class="ccrow">' +
        '<select onchange="concatSet(' + i + ',this.value)">' + colOptionsCalc(c) + '</select>' +
        '<button class="iconbtn" title="Subir" onclick="concatMove(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>&#8593;</button>' +
        '<button class="iconbtn" title="Bajar" onclick="concatMove(' + i + ',1)"' + (i === CALC_CONCAT.length - 1 ? ' disabled' : '') + '>&#8595;</button>' +
        '<button class="iconbtn del" title="Quitar" onclick="concatRemove(' + i + ')"' + (CALC_CONCAT.length <= 1 ? ' disabled' : '') + '>' + ICON_X + '</button>' +
      '</div>';
    }).join('');
  }
  function concatSet(i, val){ CALC_CONCAT[i] = val; }
  function concatMove(i, d){ var j = i + d; if (j < 0 || j >= CALC_CONCAT.length) return; var t = CALC_CONCAT[i]; CALC_CONCAT[i] = CALC_CONCAT[j]; CALC_CONCAT[j] = t; renderConcatList(); }
  function concatRemove(i){ if (CALC_CONCAT.length <= 1) return; CALC_CONCAT.splice(i, 1); renderConcatList(); }
  function concatAdd(){ CALC_CONCAT.push(CAMPOS_COLS[0] || ''); renderConcatList(); }

  function calcPreview(){
    var el = document.getElementById('calcPreview'); if (!el) return;
    var c1 = document.getElementById('calcC1').value, c2 = document.getElementById('calcC2').value;
    var u = document.getElementById('calcUnidad').value, suf = (u === 'porcentaje') ? '%' : '';
    var tipo = document.getElementById('calcTipo').value;
    if (c1 === '' || c2 === '' || isNaN(Number(c1)) || isNaN(Number(c2))){ el.innerHTML = '<span class="fmuted">Completa los cortes para ver la vista previa.</span>'; return; }
    if (Number(c1) >= Number(c2)){ el.innerHTML = '<span style="color:#c0392b;font-size:12px">El corte verde&rarr;&aacute;mbar debe ser menor que &aacute;mbar&rarr;rojo.</span>'; return; }
    var cols = (tipo === 'semaforo_inv') ? ['bad','warn','ok'] : ['ok','warn','bad'];
    var labels = ['< ' + c1 + suf, c1 + '\u2013' + c2 + suf, '> ' + c2 + suf];
    el.innerHTML = labels.map(function(l, i){ return '<span class="chip">' + dot(cols[i]) + esc(l) + '</span>'; }).join('');
  }

  function saveCalcModal(){
    var clave = CALC_EDIT ? CALC_VALS.clave : document.getElementById('calcClave').value.trim();
    var tipo = document.getElementById('calcTipo').value;
    if (!clave){ alert('Ingresa el nombre interno.'); return; }
    var payload = { claveOriginal: CALC_EDIT || '', clave: clave, tipo: tipo };
    if (tipo === 'formula'){
      var fx = document.getElementById('calcFormula').value.trim();
      if (!fx){ alert('Escribe la f\u00f3rmula.'); return; }
      payload.formula = fx;
    } else if (tipo === 'concatenado'){
      var cols = CALC_CONCAT.filter(function(c){ return c; });
      if (!cols.length){ alert('Elige al menos una columna.'); return; }
      payload.columnas = cols; payload.separador = document.getElementById('calcSep').value;
    } else {
      var c1 = document.getElementById('calcC1').value, c2 = document.getElementById('calcC2').value;
      if (c1 === '' || c2 === '' || isNaN(Number(c1)) || isNaN(Number(c2))){ alert('Completa los dos cortes con n\u00fameros.'); return; }
      if (Number(c1) >= Number(c2)){ alert('El corte verde\u2192\u00e1mbar debe ser menor que \u00e1mbar\u2192rojo.'); return; }
      payload.origen = document.getElementById('calcOrigen').value; payload.unidad = document.getElementById('calcUnidad').value;
      payload.corte1 = Number(c1); payload.corte2 = Number(c2);
    }
    var btn = document.getElementById('calcSaveBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Guardando\u2026'; }
    LAST_DETAIL = null;
    google.script.run.withSuccessHandler(function(d){ closeCalcModal(); renderCamposManager(d); })
      .withFailureHandler(function(err){ var b=document.getElementById('calcSaveBtn'); if(b){b.disabled=false;b.textContent='Guardar receta';} alert((err&&err.message)?err.message:'Error al guardar la receta.'); })
      .saveCalculado(payload);
  }

  function deleteCalc(clave){
    if (!confirm('\u00bfBorrar la receta "' + clave + '"?\n\nLa fila quedar\u00e1 hu\u00e9rfana en el gestor para que la quites cuando quieras.')) return;
    LAST_DETAIL = null;
    google.script.run.withSuccessHandler(function(d){ renderCamposManager(d); })
      .withFailureHandler(function(err){ alert((err && err.message) ? err.message : 'Error al borrar.'); })
      .deleteCalculado(clave);
  }
</script>

<style>
  .rsm-view{
    --rsm-ok:#2e9e5b; --rsm-ok-bg:#e7f4ec;
    --rsm-warn:#e0a100; --rsm-warn-bg:#fbf2d9;
    --rsm-crit:#d64545; --rsm-crit-bg:#fbe6e6;
    --rsm-line:#e6e6e6; --rsm-muted:#8a8f98; --rsm-sec:#5b6069;
    --rsm-track:#eef0f2;
    display:flex; flex-direction:column; gap:13px;
    padding:14px; max-width:520px; margin:0 auto;
    font-family:inherit; color:#20242b;
  }
  .rsm-loading{color:var(--rsm-muted);font-size:13px;padding:20px;text-align:center;}
  .rsm-head{display:flex;align-items:center;justify-content:space-between;}
  .rsm-title{font-size:16px;font-weight:600;}

  .rsm-pill-wrap{position:relative;}
  .rsm-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;
    padding:4px 10px;border-radius:999px;cursor:pointer;border:none;
    background:var(--rsm-ok-bg);color:var(--rsm-ok);}
  .rsm-pill.stale{background:var(--rsm-warn-bg);color:var(--rsm-warn);}
  .rsm-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;
    background:#fff;border:1px solid var(--rsm-line);border-radius:12px;
    padding:10px 12px;width:210px;box-shadow:0 6px 20px rgba(0,0,0,.08);display:none;}
  .rsm-pill-wrap.open .rsm-pop{display:block;}
  @media (hover:hover){ .rsm-pill-wrap:hover .rsm-pop{display:block;} }
  .rsm-pop-row{display:flex;justify-content:space-between;font-size:11px;margin:3px 0;}
  .rsm-pop-row span:first-child{color:var(--rsm-sec);}
  .rsm-pop-row span:last-child{font-weight:600;}

  .rsm-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .rsm-tile{background:#fff;border:1px solid var(--rsm-line);border-radius:12px;padding:12px;}
  .rsm-tile.nd{opacity:.7;}
  .rsm-tile-lbl{font-size:11px;color:var(--rsm-sec);}
  .rsm-tile-row{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 4px;}
  .rsm-tile-val{font-size:22px;font-weight:600;}
  .rsm-tile-badge{font-size:12px;font-weight:600;}
  .rsm-bar{position:relative;height:7px;background:var(--rsm-track);border-radius:999px;overflow:hidden;}
  .rsm-bar>i{display:block;height:100%;border-radius:999px;}
  .rsm-tick{position:absolute;top:-2px;width:2px;height:11px;background:#20242b;}
  .rsm-cap{font-size:11px;color:var(--rsm-muted);margin-top:5px;}

  .rsm-card{background:#fff;border:1px solid var(--rsm-line);border-radius:12px;padding:12px;}
  .rsm-card-t{font-size:13px;font-weight:600;margin-bottom:8px;}
  .rsm-note{font-size:11px;color:var(--rsm-muted);margin-top:9px;border-top:1px solid var(--rsm-line);padding-top:8px;}

  .rsm-tab{width:100%;table-layout:fixed;border-collapse:collapse;}
  .rsm-tab th{font-size:11px;color:var(--rsm-muted);font-weight:400;text-align:center;padding-bottom:6px;}
  .rsm-tab th.l,.rsm-tab td.l{text-align:left;}
  .rsm-tab td{font-size:12px;padding:8px 0;border-top:1px solid var(--rsm-line);text-align:center;}
  .rsm-tab td.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rsm-strong{font-weight:600;}

  .rsm-crit-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--rsm-line);padding:8px 0;}
  .rsm-crit-row:first-child{border-top:none;}
  .rsm-crit-main{flex:1;min-width:0;}
  .rsm-crit-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rsm-crit-sub{font-size:11px;color:var(--rsm-muted);}
  .rsm-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .rsm-dif{font-size:12px;font-weight:600;width:30px;text-align:right;}

  .rsm-c-ok{color:var(--rsm-ok);}   .rsm-bg-ok{background:var(--rsm-ok);}
  .rsm-c-warn{color:var(--rsm-warn);} .rsm-bg-warn{background:var(--rsm-warn);}
  .rsm-c-crit{color:var(--rsm-crit);} .rsm-bg-crit{background:var(--rsm-crit);}
  .rsm-c-nd{color:var(--rsm-muted);}  .rsm-bg-nd{background:#c7ccd2;}
</style>

<script>
/* El Resumen se pinta desde el paquete ya cargado (BOOT). No vuelve al servidor
   al navegar entre modulos; solo bootstrap() (inicio / "Ver como" / "Salir") relee. */
function cargarResumen(){
  var el = document.getElementById('rsmView');
  if (BOOT && BOOT.resumen){ rsmRender(BOOT.resumen); return; }
  el.innerHTML = '<div class="rsm-loading">Cargando resumen&hellip;</div>';
  bootstrap((window.STATE && STATE.viewAs) ? STATE.viewAs : null, 'resumen');
}

function rsmRender(d){
  var el = document.getElementById('rsmView');
  if (applyGate(d.rol) || !d.kpis) return;      // gate server-side: si no hay acceso, no pinta nada
  var k = d.kpis;
  // Pinta el chip/rol apenas responde el Resumen (no espera a getStores).
  if (d.email){
    var chip = document.getElementById('userChip');
    if (chip && chip.innerHTML.indexOf('@') < 0) chip.innerHTML = d.email + ' <span class="caret">&#9660;</span>';
    var rb = document.getElementById('roleBadge');
    if (rb && !rb.textContent) rb.textContent = (d.rol === 'ejecutivo' ? 'usuario' : d.rol);
    if (window.STATE && (!STATE.role || STATE.role === 'usuario')) STATE.role = (d.rol === 'ejecutivo' ? 'usuario' : d.rol);
  }
  var esSup = (d.rol==='supervisor' || d.rol==='maestro' || d.rol==='admin');
  var html = '';

  html += '<div class="rsm-head"><span class="rsm-title">Resumen</span>';
  html += '<div class="rsm-pill-wrap" id="rsmPillWrap">';
  html += '<button type="button" class="rsm-pill'+(d.meta&&d.meta.stale?' stale':'')+'" onclick="rsmTogglePill()">'
        + '&#x21bb; '+((d.meta&&d.meta.reporteCorto)||'—')+' &#9662;</button>';
  html += '<div class="rsm-pop">'
        + '<div class="rsm-pop-row"><span>Reporte actualizado</span><span>'+((d.meta&&d.meta.reporteLargo)||'—')+'</span></div>'
        + '<div class="rsm-pop-row"><span>Última evaluación</span><span>'+((d.meta&&d.meta.evalLargo)||'—')+'</span></div>'
        + '</div></div></div>';

  html += '<div class="rsm-tiles">';
  html += rsmTile('Ventas', rsmNum(k.ventas.valor), rsmPct(k.ventas.proyPct), k.ventas.estado, k.ventas.barra, k.ventas.tick, rsmNum(k.ventas.proy), rsmNum(k.ventas.cuota));
  html += rsmTile('Activas', String(k.activas.valor), rsmPct(k.activas.pct), k.activas.estado, k.activas.barra, k.activas.tick, String(k.activas.valor), rsmNum(k.activas.cuota));
  html += rsmTile('FPD15', rsmFpd(k.fpd.valor), rsmPct(k.fpd.cumpl), k.fpd.estado, k.fpd.barra, k.fpd.tick, rsmPct2(k.fpd.valor), rsmPct2(k.fpd.cuota));
  html += rsmTile('Venta Conjunta', rsmPct(k.vc.ratio), rsmPct(k.vc.cumpl), k.vc.estado, k.vc.barra, k.vc.tick, rsmPct(k.vc.ratio), rsmPct(k.vc.meta));
  html += '</div>';

  if(esSup && d.seguimiento && d.seguimiento.length){
    html += '<div class="rsm-card"><div class="rsm-card-t">Seguimiento por ejecutivo</div>';
    html += '<table class="rsm-tab"><thead><tr><th class="l">Ejecutivo</th><th>Vta</th><th>Act</th><th>FPD</th><th>VC</th></tr></thead><tbody>';
    d.seguimiento.forEach(function(s){
      html += '<tr>'
        + '<td class="l">'+rsmCorto(s.ejecutivo)+'</td>'
        + rsmCell(rsmPct(s.ventasProyPct), rsmEstCump(s.ventasProyPct))
        + rsmCell(rsmPct(s.activasPct), rsmEstCump(s.activasPct))
        + rsmCell(rsmFpd(s.fpd), rsmEstCump(s.fpdCumpl))
        + rsmCell(rsmPct(s.vc), rsmEstCump(s.vc==null?null:s.vc/0.60))
        + '</tr>';
    });
    html += '</tbody></table>';
    html += '<div class="rsm-note">Vta = proyección vs cuota · FPD = cumplimiento vs cuota · VC = ratio de activación vs meta 60%</div></div>';
  }

  html += '<div class="rsm-card"><div class="rsm-card-t">Tiendas críticas</div>';
  if(!d.criticas.length){ html += '<div class="rsm-cap">Sin tiendas en alerta.</div>'; }
  else {
    d.criticas.forEach(function(t){
      html += '<div class="rsm-crit-row"><div class="rsm-crit-main">'
        + '<div class="rsm-crit-name">'+t.id+' - '+t.nombre+'</div>'
        + (esSup && t.ejecutivo ? '<div class="rsm-crit-sub">Ejec. '+rsmCorto(t.ejecutivo)+'</div>' : '')
        + '</div>'
        + '<span class="rsm-dif '+rsmC(t.difEstado)+'">'+(t.dif==null?'—':t.dif)+'</span>'
        + '<span class="rsm-dot '+rsmBg(t.fpd7Estado)+'" title="FPD7"></span>'
        + '<span class="rsm-dot '+rsmBg(t.fpd15Estado)+'" title="FPD15"></span>'
        + '</div>';
    });
  }
  html += '</div>';
  el.innerHTML = html;
  hideBoot();  
}

// Tile unificado: número grande · insignia de cumplimiento % · barra con tick al 100% · leyenda "real de cuota".
function rsmTile(lbl, big, badge, estado, barra, tick, capReal, capCuota){
  return '<div class="rsm-tile'+(estado==='nd'?' nd':'')+'">'
    + '<div class="rsm-tile-lbl">'+lbl+'</div>'
    + '<div class="rsm-tile-row"><span class="rsm-tile-val">'+big+'</span>'
    + '<span class="rsm-tile-badge '+rsmC(estado)+'">'+badge+'</span></div>'
    + rsmBar(barra, estado, tick)
    + '<div class="rsm-cap">'+capReal+' de '+capCuota+'</div></div>';
}
function rsmPct2(x){ return x==null ? '—' : (x*100).toFixed(2)+'%'; }

// Gate de acceso: bloquea TODO (sin datos, sin módulos, sin nav).
function rsmBlocked(role){ return ['baja','sin_acceso','solicitar'].indexOf(String(role||'').toLowerCase()) > -1; }
function applyGate(role){
  if (!rsmBlocked(role)) return false;
  var hide = function(sel){ var e=document.querySelector(sel); if(e) e.style.display='none'; };
  hide('.hamb'); hide('.chipwrap');
  var badge=document.getElementById('roleBadge'); if(badge) badge.style.display='none';
  var vb=document.getElementById('viewBanner'); if(vb) vb.style.display='none';
  ['storeView','usersView','camposView','visitasView','rsmView'].forEach(function(id){ var e=document.getElementById(id); if(e) e.style.display='none'; });
  var msg = (String(role).toLowerCase()==='solicitar')
    ? 'No tienes acceso todav\u00eda. Escr\u00edbele a Alfredo Cortez (alfredo.cortez@payjoy.com) por Slack para que te habilite el ingreso.'
    : 'No tienes acceso a esta aplicaci\u00f3n.';
  var g=document.getElementById('accessGate');
  if(!g){ g=document.createElement('div'); g.id='accessGate'; var w=document.querySelector('.wrap'); w.parentNode.insertBefore(g, w); }
  g.style.cssText='max-width:520px;margin:60px auto;padding:28px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6';
  g.innerHTML='<div style="font-size:40px;margin-bottom:12px">&#128274;</div>'
    + '<div style="color:var(--ink);font-weight:600;font-size:17px;margin-bottom:8px">Acceso restringido</div><div>'+msg+'</div>';
  hideBoot();  
  return true;
}
function rsmBar(p, estado, tick){
  var t = tick>0 ? '<span class="rsm-tick" style="left:'+Math.round(tick*100)+'%"></span>' : '';
  return '<div class="rsm-bar"><i class="'+rsmBg(estado)+'" style="width:'+Math.round(p*100)+'%"></i>'+t+'</div>';
}
function rsmCell(txt, estado){ return '<td class="rsm-strong '+rsmC(estado)+'">'+txt+'</td>'; }
function rsmTogglePill(){ document.getElementById('rsmPillWrap').classList.toggle('open'); }
function rsmNum(n){ return (n==null?0:n).toLocaleString('es-PE'); }
function rsmPct(x){ return x==null ? '—' : Math.round(x*100)+'%'; }
function rsmFpd(x){ return x==null ? 'N/D' : (x*100).toFixed(2)+'%'; }
function rsmCorto(email){ if(!email) return '—'; var p=email.split('@')[0].split('.');
  return p.length>1 ? (p[0].charAt(0)+'. '+p[1].charAt(0).toUpperCase()+p[1].slice(1)) : p[0]; }
function rsmC(e){ return e==='ok'?'rsm-c-ok':e==='warn'?'rsm-c-warn':e==='crit'?'rsm-c-crit':'rsm-c-nd'; }
function rsmBg(e){ return e==='ok'?'rsm-bg-ok':e==='warn'?'rsm-bg-warn':e==='crit'?'rsm-bg-crit':'rsm-bg-nd'; }
function rsmEstCump(p){ if(p==null)return'nd'; if(p>=1)return'ok'; if(p>=0.9)return'warn'; return'crit'; }
function rsmEstFpd(f){ if(f==null)return'nd'; if(f<=0.06)return'ok'; if(f<=0.079)return'warn'; return'crit'; }
function rsmEtiqFpd(e){ return e==='ok'?'sano':e==='warn'?'alerta':e==='crit'?'crítico':'N/D'; }

/* ---------- enganche con la navegación existente ---------- */
function showResumen(){
  var ids=['storeView','usersView','camposView','visitasView'];
  ids.forEach(function(id){ var e=document.getElementById(id); if(e) e.style.display='none'; });
  var rv=document.getElementById('rsmView'); if(rv) rv.style.display='';
  if(typeof updateNavActive==='function') updateNavActive('resumen');
  cargarResumen();
}
/* Al mostrar otra vista, oculta el Resumen (sin editar tus funciones). */
['showStores','showVisitas','showUsers','showCampos'].forEach(function(fn){
  var orig=window[fn];
  if(typeof orig==='function'){
    window[fn]=function(){ var rv=document.getElementById('rsmView'); if(rv) rv.style.display='none'; return orig.apply(this,arguments); };
  }
});
/* navGo('resumen') + marcar activo el ítem de nav. */
(function(){
  var oNav=window.navGo;
  window.navGo=function(mod){
    if(mod==='resumen'){
      if(typeof camposGuard==='function' && !camposGuard()) return;
      if(typeof closeNav==='function') closeNav();
      showResumen(); return;
    }
    return (typeof oNav==='function') ? oNav.apply(this,arguments) : undefined;
  };
  var oAct=window.updateNavActive;
  window.updateNavActive=function(mod){
    if(typeof oAct==='function') oAct(mod);
    var n=document.getElementById('navResumen'); if(n) n.classList.toggle('active', mod==='resumen');
  };
})();

/* ===== Carga unificada: UNA sola lectura del servidor arma Resumen + Tiendas ===== */
var BOOT = null;   // { stores, resumen } del ultimo bootstrap

function bootstrap(viewAs, landView){
  STATE.viewAs = viewAs || null;
  landView = landView || 'resumen';
  if (landView === 'tiendas'){
    showStores();
    var g = document.getElementById('grid'); if (g) g.innerHTML = LOADING_HTML;
  } else {
    var rv = document.getElementById('rsmView');
    if (rv){ rv.style.display = ''; rv.innerHTML = '<div class="rsm-loading">Cargando resumen&hellip;</div>'; }
  }
  google.script.run
    .withSuccessHandler(function(res){ onBootstrap(res, landView); })
    .withFailureHandler(onBootError)
    .getBootstrap(viewAs || null);
}

function onBootstrap(res, landView){
  BOOT = res;
  if (applyGate(res.stores.role)) return;    // bloqueado -> pantalla de acceso
  onData(res.stores);                         // pobla STATE + pinta grid (sin cambiar de vista)
  if (landView === 'tiendas') showStores();   // Tiendas ya renderizado
  else showResumen();                         // Resumen se pinta desde BOOT (instantaneo)
  hideBoot();
}

function onBootError(err){
  var rv = document.getElementById('rsmView');
  if (rv && rv.style.display !== 'none') rv.innerHTML = '<div class="rsm-loading">No se pudo cargar. Reintenta.</div>';
  var g = document.getElementById('grid');
  if (g && !g.innerHTML) g.innerHTML = '<div class="empty">No se pudo cargar la data.<br>' + (err && err.message ? err.message : '') + '</div>';
  hideBoot();
}

if (!window.VC_MODULO) bootstrap(null, 'resumen');   // arranque: UNA lectura arma todo y aterriza en Resumen
</script>
<script>
/* =====================================================================
 * ADAPTADOR
 * 1) Protección de cambios sin guardar en Campos (aplica en todas las versiones):
 *    barra fija de aviso, borrador automático en el navegador y aviso al cerrar.
 * 2) Páginas por módulo: si la página fijó window.VC_MODULO =
 *    'resumen' | 'tiendas' | 'visitas' | 'usuarios' | 'campos'
 *    - Oculta el menú de módulos, el menú del correo y los botones "Volver".
 *    - Arranca y se queda en el módulo de la página.
 *    - "Ver como" se conserva entre páginas; desde Usuarios abre la página Resumen.
 * ===================================================================== */

/* ---------- 1) Campos: protección de cambios sin guardar ---------- */
(function(){
  if (typeof window.renderCamposManager !== 'function' || typeof window.refreshSaveBtn !== 'function') return;
  var KEY = 'vc_campos_borrador';
  function leer(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; } }
  function guardar(b){ try { localStorage.setItem(KEY, JSON.stringify(b)); } catch(e){} }
  function borrar(){ try { localStorage.removeItem(KEY); } catch(e){} }
  function proyeccion(estado){
    return JSON.stringify((estado || []).map(function(it){
      return { columna: it.columna, etiqueta: it.etiqueta, enDetalle: !!it.enDetalle, formato: it.formato, protegida: !!it.protegida };
    }));
  }
  function enCampos(){ var cv = document.getElementById('camposView'); return !!(cv && cv.style.display !== 'none' && document.getElementById('fieldList')); }
  function sucio(){ return enCampos() && CAMPOS_STATE.length && JSON.stringify(camposProjection()) !== CAMPOS_SNAP; }

  var css = document.createElement('style');
  css.textContent =
    '#vcPendiente{position:fixed;left:0;right:0;bottom:0;z-index:900;display:none;align-items:center;gap:12px;' +
      'padding:12px 16px;background:#fff4d6;border-top:2px solid #e0a800;font-size:14px;color:#5c4400;box-shadow:0 -2px 8px rgba(0,0,0,.08)}' +
    '#vcPendiente b{flex:1}#vcPendiente button{border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:#1f7c2e;color:#fff}' +
    '#vcBorrador{margin:0 0 12px;padding:12px 14px;border-radius:10px;background:#eef6ff;border:1px solid #9cc3ef;color:#123a63;font-size:14px}' +
    '#vcBorrador .acc{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}#vcBorrador button{border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}' +
    '#vcBorrador .rec{background:#1f7c2e;color:#fff}#vcBorrador .des{background:#e6e9e6;color:#1a1f1a}#vcBorrador .ojo{margin-top:6px;color:#8a4b00}' +
    'body.vc-pend{padding-bottom:64px}';
  document.head.appendChild(css);
  var barra = document.createElement('div');
  barra.id = 'vcPendiente';
  barra.innerHTML = '<b>Tienes cambios sin guardar en Campos</b><button type="button">Guardar</button>';
  barra.querySelector('button').onclick = function(){ if (typeof saveCampos === 'function') saveCampos(); };
  document.body.appendChild(barra);

  function actualizar(){
    var s = sucio();
    barra.style.display = s ? 'flex' : 'none';
    document.body.classList.toggle('vc-pend', !!s);
    if (!enCampos()) return;
    if (s) guardar({ base: CAMPOS_SNAP, estado: CAMPOS_STATE, guardado: Date.now() });
    else borrar();
  }

  var refrescarOriginal = window.refreshSaveBtn;
  window.refreshSaveBtn = function(){ var r = refrescarOriginal.apply(this, arguments); actualizar(); return r; };

  var renderOriginal = window.renderCamposManager;
  window.renderCamposManager = function(d){
    var r = renderOriginal.apply(this, arguments);
    var b = leer();
    if (b && b.estado && proyeccion(b.estado) !== CAMPOS_SNAP) ofrecerBorrador(b);
    else borrar();
    actualizar();
    return r;
  };

  function ofrecerBorrador(b){
    var cv = document.getElementById('camposView'); if (!cv) return;
    var fecha = '';
    try { fecha = new Date(b.guardado).toLocaleString('es-PE', { dateStyle: 'short', timeStyle: 'short' }); } catch(e){}
    var cambio = (b.base !== CAMPOS_SNAP);
    var aviso = document.createElement('div');
    aviso.id = 'vcBorrador';
    aviso.innerHTML = '<div><b>Tienes cambios sin guardar</b> de la vez anterior' + (fecha ? ' (' + fecha + ')' : '') + '.</div>' +
      (cambio ? '<div class="ojo">&#9888; La configuración guardada cambió desde entonces. Si recuperas y guardas, tu borrador reemplazará esa versión.</div>' : '') +
      '<div class="acc"><button type="button" class="rec">Recuperar cambios</button><button type="button" class="des">Descartar</button></div>';
    cv.insertBefore(aviso, cv.firstChild);
    aviso.querySelector('.rec').onclick = function(){
      CAMPOS_STATE = b.estado;
      aviso.remove();
      renderCamposRows();
      refreshSaveBtn();
    };
    aviso.querySelector('.des').onclick = function(){ borrar(); aviso.remove(); actualizar(); };
  }

  // Al salir de Campos por la propia app (Volver, otro módulo), la barra se esconde sola.
  ['showStores', 'showVisitas', 'showUsers', 'showResumen'].forEach(function(fn){
    var o = window[fn]; if (typeof o !== 'function') return;
    window[fn] = function(){ var r = o.apply(this, arguments); actualizar(); return r; };
  });

  // Refuerzo: aviso del navegador al cerrar o recargar con cambios pendientes.
  window.addEventListener('beforeunload', function(e){ if (sucio()){ e.preventDefault(); e.returnValue = ''; return ''; } });
})();

/* ---------- 2) Páginas por módulo ---------- */
(function(){
  var MOD = window.VC_MODULO;
  if (!MOD) return;
  // Nombres internos de las páginas en Creator (para el salto de "Ver como").
  var PAGINAS = { resumen: 'Resumen', tiendas: 'Tiendas', visitas: 'Visitas', usuarios: 'Usuarios', campos: 'Campos' };

  var css = document.createElement('style');
  css.textContent = '.hamb,#navPanel,#navOverlay,#userMenu,#userChip .caret,[onclick="volverModulo()"]{display:none!important}' +
                    '#userChip{cursor:default!important}';
  document.head.appendChild(css);
  window.toggleMenu = function(ev){ if (ev) ev.stopPropagation(); };

  var CLAVE = 'vc_viewAs';
  function leerVA(){ try { return sessionStorage.getItem(CLAVE) || null; } catch(e){ return null; } }
  function guardarVA(v){ try { if (v) sessionStorage.setItem(CLAVE, v); else sessionStorage.removeItem(CLAVE); } catch(e){} }

  function irAPagina(mod){
    var ip = window.VC_INIT || {};
    var url = 'https://creatorapp.zoho.com/' + (ip.scope || 'payjoy_ec') + '/' + (ip.appLinkName || 'app-de-campo') +
              (ip.envUrlFragment || '') + '/#Page:' + PAGINAS[mod];
    try {
      ZOHO.CREATOR.UTIL.navigateParentURL({ action: 'open', url: url, window: 'same' });
    } catch(e){
      alert('Vista activada. Abre "' + PAGINAS[mod] + '" desde el menú de la app.');
    }
  }

  function mensaje(el, html){ if (el){ el.style.display = ''; el.innerHTML = '<div class="empty">' + html + '</div>'; } }

  var bootOriginal = window.bootstrap;
  if (MOD === 'resumen' || MOD === 'tiendas'){
    // Mismo bootstrap original, pero siempre aterriza en el módulo de la página.
    window.bootstrap = function(viewAs){ guardarVA(viewAs || null); return bootOriginal(viewAs || null, MOD); };
  } else {
    // Visitas / Usuarios / Campos: bootstrap liviano (sin tiendas) para validar acceso y rol, y luego su pantalla.
    var vista = { visitas: 'visitasView', usuarios: 'usersView', campos: 'camposView' }[MOD];
    window.bootstrap = function(viewAs){
      viewAs = viewAs || null;
      guardarVA(viewAs);
      STATE.viewAs = viewAs;
      var el = document.getElementById(vista);
      if (el){ el.style.display = ''; el.innerHTML = LOADING_HTML; }
      google.script.run
        .withSuccessHandler(function(res){
          window.BOOT = res;
          if (applyGate(res.stores.role)) return;
          onData(res.stores);
          var sv = document.getElementById('storeView'); if (sv) sv.style.display = 'none';
          var rv = document.getElementById('rsmView'); if (rv) rv.style.display = 'none';
          if (MOD === 'visitas') showVisitas();
          else if (MOD === 'usuarios'){
            if (STATE.role === 'maestro' || STATE.role === 'supervisor') showUsers();
            else mensaje(el, 'Esta página es para maestros y supervisores.');
          } else {
            if (STATE.role === 'maestro') showCampos();
            else mensaje(el, 'Esta página es solo para el rol maestro.');
          }
          hideBoot();
        })
        .withFailureHandler(function(err){ mensaje(el, 'No se pudo cargar.<br>' + (err && err.message ? err.message : '')); hideBoot(); })
        .getBootstrap(viewAs);
    };
  }

  if (MOD === 'usuarios'){
    // Desde Usuarios, "Ver como" guarda la vista elegida y abre la página Resumen.
    window.verComo = function(email){ if (!email) return; guardarVA(String(email).trim().toLowerCase()); irAPagina('resumen'); };
  }

  window.bootstrap(leerVA());
})();

</script>
